<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUD Editor</title>
<style>
  :root { --bg: #16181c; --panel: #1f2228; --line: #2c3038; --text: #e6e6e6; --dim: #8b919c; --accent: #ffb000; --sel: #4da3ff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 440px; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  #preview { display: flex; align-items: center; justify-content: center; background: #000; min-width: 0; min-height: 0; padding: 8px; }
  #stage { position: relative; max-width: 100%; max-height: 100%; }
  #stage.schematic { width: min(100%, calc((100vh - 16px) * var(--aspect, 1.7778))); aspect-ratio: var(--aspect, 1.7778); background: #0d0e11; border: 1px solid var(--line); }
  #video { display: block; max-width: 100%; max-height: calc(100vh - 16px); }
  #boxes { position: absolute; inset: 0; cursor: crosshair; overflow: hidden; } /* a part moved off screen mustn't widen the page */
  .box { position: absolute; border: 1px dashed rgba(255, 176, 0, .45); opacity: 0; transition: opacity .1s; pointer-events: none; }
  .box span { position: absolute; left: -1px; bottom: 100%; display: none; padding: 0 4px; font-size: 11px; white-space: nowrap; background: rgba(0, 0, 0, .8); color: var(--accent); }
  .box.thing { opacity: 0; }
  #stage:hover .box.thing, .schematic .box.thing { opacity: 1; }
  .box.hover { opacity: 1; border: 2px solid var(--accent); background: rgba(255, 176, 0, .12); }
  .box.hover.drag { border-style: dashed; background: rgba(255, 176, 0, .2); }
  .box.sel { opacity: 1; border: 2px solid var(--sel); background: rgba(77, 163, 255, .15); }
  .box.sel span { color: var(--sel); }
  .box.hover span, .box.sel span { display: block; }
  #empty { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px; color: var(--dim); text-align: center; pointer-events: none; }
  #empty p { max-width: 420px; margin: 4px 0; }
  #empty b { color: var(--text); }
  aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  button { background: #2c3038; color: var(--text); border: 1px solid #3a3f49; border-radius: 4px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; border-color: #3a3f49; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  #texts button[aria-pressed="false"] { opacity: .5; text-decoration: line-through; }
  button[aria-pressed="true"] { border-color: var(--accent); }
  #hudbtn { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input[type=search], input[type=number], .row input:not([type]) { min-width: 0; background: #16181c; color: var(--text); border: 1px solid #3a3f49; border-radius: 4px; padding: 6px 8px; font: inherit; }
  input[type=search] { flex: 1; }
  #list { flex: 1; overflow: auto; }
  h3 { margin: 0; padding: 14px 12px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); border-bottom: 1px solid var(--line); }
  .crumbs { padding: 8px 12px; font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--line); }
  .crumbs .meta { font-weight: 400; }
  .crumbs .done { float: right; padding: 2px 10px; font-size: 12px; font-weight: 400; }
  .sub { padding: 8px 12px 4px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  .thing-btn { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px 12px; background: none; text-align: left; }
  .thing-btn.sel { color: var(--sel); background: rgba(77, 163, 255, .08); }
  .thing-btn { align-items: center; gap: 8px; }
  .thing-btn .name { flex: 1; }
  .thing-btn.hidden .name { color: var(--dim); text-decoration: line-through; }
  .thing-btn .eye { padding: 1px 8px; border: 1px solid #3a3f49; border-radius: 4px; font-size: 11px; color: var(--dim); }
  .thing-btn .eye:hover { border-color: var(--accent); color: var(--text); }
  .row.note { display: block; }
  .row.sides { grid-template-columns: 1fr repeat(4, auto); gap: 10px; }
  .row.sides label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .row.menuitem { grid-template-columns: 1fr repeat(3, 30px); gap: 4px; }
  .row.cmdbtn { grid-template-columns: 1fr 1.3fr 30px; gap: 6px; }
  .row.lineup { grid-template-columns: 54px repeat(4, 1fr); gap: 4px; }
  .row.lineup button { padding: 3px 2px; font-size: 11px; }
  .box.guide { opacity: 1; top: 0; bottom: 0; width: 0; border: none; border-left: 1px dashed rgba(245, 197, 66, .8); }
  .row.menuadd { grid-template-columns: 1fr auto; gap: 6px 8px; padding: 10px 12px; }
  .row.menuadd > .meta, .row.menuadd > .wide { grid-column: 1 / -1; }
  .row.menuadd > .meta { color: var(--text); font-size: 12px; font-weight: 600; }
  .row.action { display: flex; gap: 8px; padding: 10px 12px; }
  .row.action button { flex: 1; padding: 8px 10px; }
  button.ghost { background: transparent; border-style: dashed; border-color: #4a505b; color: var(--dim); }
  button.ghost:hover { color: var(--text); }
  /* colour rows: RGB over the picker, opacity over its swatch, then the name and what it's for */
  .row.colour { grid-template-columns: 66px 40px 1fr 62px; gap: 10px; align-items: center; }
  .row.colour .pick { display: grid; gap: 3px; justify-items: center; }
  .row.colour .acts { display: grid; gap: 4px; justify-items: stretch; }
  .row.colour .acts .reset { margin: 0; padding: 1px 8px; }
  .row.colour .val { font: 10px/1 ui-monospace, Consolas, monospace; color: var(--dim); text-align: center; white-space: nowrap; }
  .row.colour .swatch { width: 40px; height: 26px; padding: 0; border: 1px solid #3a3f49; border-radius: 4px; cursor: pointer;
    background: linear-gradient(var(--c), var(--c)), repeating-conic-gradient(#4a4e57 0 25%, #2b2e35 0 50%) 0 0 / 10px 10px; }
  .row.colour .swatch:hover { border-color: var(--accent); }
  .swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row.colour .name { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .row.colour .meta { margin-top: 1px; }
  /* the colour picker */
  .cpop { position: fixed; z-index: 20; width: 236px; padding: 12px; display: grid; gap: 10px; background: #262a31; border: 1px solid #3a3f49; border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .55); }
  .cpop .sv { position: relative; height: 140px; border-radius: 6px; cursor: crosshair; touch-action: none;
    background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, var(--h)); }
  .cpop .bar { position: relative; height: 12px; border-radius: 6px; cursor: ew-resize; touch-action: none; }
  .cpop .hue { background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  .cpop .alpha { background: linear-gradient(to right, var(--c), transparent), repeating-conic-gradient(#4a4e57 0 25%, #2b2e35 0 50%) 0 0 / 8px 8px; }
  .cpop i { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 1px 4px rgba(0, 0, 0, .5); pointer-events: none; }
  .cpop .bar i { top: 50%; background: transparent; }
  .cpop .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cpop .nums label { display: grid; gap: 3px; justify-items: center; font-size: 10px; color: var(--dim); }
  .cpop .nums input { width: 100%; padding: 4px 2px; text-align: center; background: #16181c; color: var(--text); border: 1px solid #3a3f49; border-radius: 4px; font: 12px ui-monospace, Consolas, monospace; -moz-appearance: textfield; }
  .cpop .nums input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .cpop .foot { display: flex; gap: 6px; align-items: center; }
  .cpop .prev { flex: 0 0 34px; height: 28px; border-radius: 5px; border: 1px solid #3a3f49;
    background: linear-gradient(var(--c), var(--c)), repeating-conic-gradient(#4a4e57 0 25%, #2b2e35 0 50%) 0 0 / 8px 8px; }
  .cpop .foot button { flex: 1; padding: 5px 0; }
  /* on/off rows, as wide as the number boxes */
  .seg { display: flex; }
  .seg button { flex: 1; padding: 4px 0; border: 1px solid #3a3f49; border-radius: 0; background: #1b1e23; color: var(--dim); font-size: 12px; }
  .seg button + button { border-left: 0; }
  .seg button:first-child { border-radius: 4px 0 0 4px; }
  .seg button:last-child { border-radius: 0 4px 4px 0; }
  .seg button[aria-pressed="true"] { background: #2f343d; color: var(--text); border-color: #3a3f49; }
  .seg button:last-child[aria-pressed="true"] { background: rgba(255, 176, 0, .16); color: var(--accent); }
  /* + under a font: the settings it can also have */
  .row.addkey { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row.addkey .plus { width: 26px; height: 26px; padding: 0; border-radius: 50%; font-size: 16px; line-height: 1; color: var(--dim); }
  .row.addkey .plus:hover, .row.addkey .plus.open { color: var(--accent); }
  .row.addkey .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .row.addkey .chips button { padding: 2px 9px; border-radius: 12px; font-size: 12px; }
  .card.fonts .divider { display: flex; align-items: center; gap: 6px; }
  .card.fonts .divider > .renamed-wrap { flex: 1; }
  .card.fonts .divider .addfont { margin: 0; font-weight: 400; }
  /* renamed words: a small way back */
  .unrename { margin-left: 4px; padding: 0 5px; font-size: 11px; line-height: 16px; color: var(--dim); background: transparent; border: 1px solid transparent; border-radius: 4px; vertical-align: 1px; }
  .unrename:hover { color: var(--accent); border-color: #3a3f49; }
  /* cards fold from the chevron in their title */
  .card > .sub { display: flex; align-items: center; gap: 6px; }
  .card > .sub > .renamed-wrap { flex: 1; }
  .fold-btn { flex: none; width: 22px; height: 22px; padding: 0; display: grid; place-items: center; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--dim); }
  .fold-btn:hover { background: #2c3038; border-color: #3a3f49; color: var(--text); }
  .fold-btn svg { width: 12px; height: 12px; transition: transform .15s; }
  .card.folded .fold-btn svg { transform: rotate(-90deg); }
  .card.folded > :not(.sub) { display: none; }
  .card.folded > .sub { border-bottom: 0; }
  /* a selection's sections in folders, like a directory */
  .group { margin: 0 0 8px; }
  .group-head { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 4px; background: none; border: 0; border-radius: 6px; color: var(--text); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .group-head:hover { background: #22262d; }
  .group-head svg { width: 12px; height: 12px; color: var(--dim); transition: transform .15s; }
  .group.folded .group-head svg { transform: rotate(-90deg); }
  .group-head .count { margin-left: auto; padding: 0 7px; border-radius: 9px; background: #2c3038; color: var(--dim); font-size: 11px; font-weight: 400; letter-spacing: 0; }
  .group-body { margin: 2px 0 0 9px; padding: 4px 0 0 10px; border-left: 1px solid #343944; }
  .group.folded .group-body { display: none; }
  .card.fonts .divider { padding: 7px 12px; background: var(--head); color: var(--text); font-size: 12px; font-weight: 600; border-top: 2px solid #3a3f49; }
  .card.fonts .divider:first-child { border-top: 0; }
  .card.fonts .divider + * { border-top: 1px solid var(--line); }
  .rename[contenteditable="plaintext-only"] { outline: 1px solid var(--accent); outline-offset: 1px; border-radius: 2px; cursor: text; }
  .row .reset { margin-left: 8px; padding: 0 6px; font-size: 11px; color: var(--dim); }
  .row.pick { grid-template-columns: 1fr minmax(0, 190px); }
  .row.pick .meta { grid-column: 2; }
  select { min-width: 0; background: #16181c; color: var(--text); border: 1px solid #3a3f49; border-radius: 4px; padding: 5px 6px; font: inherit; }
  details { border-bottom: 1px solid var(--line); }
  summary { padding: 9px 12px; cursor: pointer; font-weight: 600; }
  .fold summary { font-weight: 400; border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 40px 1fr 72px; gap: 10px; align-items: center; padding: 6px 12px; border-top: 1px solid var(--line); }
  .row.num { grid-template-columns: 1fr 112px 100px; }
  .row button.mini { margin-left: 8px; padding: 1px 7px; font-size: 11px; }
  .row button.mini + button.mini { margin-left: 4px; }
  .step { display: flex; }
  .step input { width: 100%; text-align: center; border-radius: 0; -moz-appearance: textfield; }
  .step input::-webkit-inner-spin-button, .step input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .step button { flex: 0 0 26px; padding: 0; background: #22262d; color: var(--dim); border: 1px solid #3a3f49; font: inherit; font-size: 15px; line-height: 1; cursor: pointer; }
  .step button:hover { color: var(--text); background: #2b3038; border-color: var(--accent); }
  .step button:first-child { border-radius: 4px 0 0 4px; border-right: 0; }
  .step button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
  .row.check { grid-template-columns: 40px 1fr; cursor: pointer; }
  .row input[type=color] { width: 40px; height: 26px; padding: 0; border: 1px solid #3a3f49; border-radius: 4px; background: none; cursor: pointer; }
  .row input[type=range] { width: 72px; }
  .row input[type=checkbox] { justify-self: center; }
  .key { font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
  .meta { font-size: 11px; color: var(--dim); }
  #picker { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .6); z-index: 10; }
  #picker > div { width: min(520px, 92vw); max-height: 80vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  #picker h2 { margin: 0 0 4px; font-size: 16px; }
  #picker .hud { display: block; width: 100%; margin: 6px 0; text-align: left; }
  #newform { display: flex; gap: 8px; margin: 6px 0; }
  #newform[hidden] { display: none; }
  #newform input { flex: 1; min-width: 0; background: #16181c; color: var(--text); border: 1px solid #3a3f49; border-radius: 4px; padding: 6px 8px; font: inherit; }
  #picker .hud .meta { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 860px) { body { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
  /* sidebar: a header with the HUD and game tools, then cards of settings */
  :root { --card: #23262d; --head: #292d35; }
  aside { background: var(--bg); }
  .top { padding: 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .top .line { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .top .glabel { font-size: 11px; color: var(--dim); min-width: 62px; }
  .top .line button { padding: 5px 9px; }
  #texts button { padding: 3px 9px; border-radius: 12px; font-size: 12px; }
  .bar { padding: 8px 10px; border-bottom: 0; }
  /* messages: a note that pops up at the bottom of the sidebar and fades */
  aside { position: relative; }
  #status { position: absolute; left: 10px; right: 10px; bottom: 12px; z-index: 5; padding: 9px 12px; border: 1px solid #3a3f49; border-radius: 8px;
    background: rgba(40, 44, 52, .97); color: var(--text); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); pointer-events: none;
    opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; }
  #status.show { opacity: 1; transform: none; }
  /* test tools: folded under the Test server button */
  .toolsbtn { display: inline-flex; align-items: center; gap: 6px; }
  .toolsbtn svg { width: 12px; height: 12px; transition: transform .15s; }
  .toolsbtn[aria-expanded="true"] { border-color: var(--accent); }
  .toolsbtn[aria-expanded="true"] svg { transform: rotate(180deg); }
  #tools { display: grid; gap: 8px; padding: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  #tools .tline { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #list { padding: 0 10px 16px; }
  #list h3 { border: 0; padding: 4px 2px 8px; }
  .card, #list > details { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px; overflow: hidden; }
  .card > .sub { padding: 8px 12px; background: var(--head); color: var(--text); font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; }
  .card > .sub + * { border-top: 1px solid var(--line); }
  .card .row { border-top-color: #2a2e35; }
  .card .thing-btn { border-bottom-color: #2a2e35; }
  .card .thing-btn:last-child { border-bottom: 0; }
  #list > details > summary { background: var(--head); }
  .crumbs { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; margin: 0 -10px 10px; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .crumbs .what { font-weight: 600; }
  .crumbs .meta { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumbs .done { float: none; margin-left: auto; padding: 4px 14px; font-size: 13px; }
  .crumbs .back { padding: 4px 10px; font-size: 12px; font-weight: 400; }
  select option:disabled { color: #666; }
</style>
</head>
<body>
<main id="preview">
  <div id="stage" class="schematic">
    <canvas id="video" hidden></canvas>
    <div id="empty"><p><b>Starting...</b></p></div>
    <div id="boxes"></div>
  </div>
</main>
<aside>
  <div class="top">
  <div class="line">
    <button id="hudbtn" title="Pick which HUD to edit">No HUD open</button>
    <button id="save" class="primary" disabled>Save HUD</button>
    <button id="undo" disabled title="Undo the last change (Ctrl+Z)">Undo</button>
    <button id="explore" title="Open the HUD's folder">Folder</button>
  </div>
  <div class="line">
    <button id="testserver" title="Offline game with a frozen bot and bhop/surf-style timer texts on screen">Test server</button>
    <button id="toolsbtn" class="toolsbtn" aria-expanded="false" title="Scoreboard and the sample texts on the test server">Test tools
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="capture" hidden>Capture game</button>
    <button id="launch" hidden>Launch game</button>
  </div>
  <div id="tools" hidden>
    <div class="tline">
      <span class="glabel">Keep open</span>
      <button id="scores" aria-pressed="false" title="Keep the scoreboard open to edit it. Click again (or press Tab in the game) to close it.">Scoreboard</button>
      <button id="keepchat" aria-pressed="false" title="Keep the chat open (typing) to edit it: opened again after a change reloads the HUD. Click again to close it.">Chat</button>
    </div>
    <div class="tline" id="texts">
      <span class="glabel">Sample text</span>
      <button data-bit="1" title="Timer box (font HudHintText) and right-side text (HudHintTextSmall)">Timer</button>
      <button data-bit="2" title="Speed in the centre print (font Trebuchet24, SourceScheme)">Small speed</button>
      <button data-bit="4" title="Large speed text under it, like jhud (font CenterPrintText, ClientScheme)">Large speed</button>
      <button data-bit="8" title="Record times in the top left corner (font CenterPrintText, ClientScheme)">Top left</button>
      <button data-bit="16" title="A chat line every few seconds (font ChatFont, ChatScheme)">Chat lines</button>
    </div>
    <div class="tline" id="values">
      <span class="glabel">Test values</span>
      <button data-cmd="schemereload_testvalue health 5" title="Low health: the number turns the low health colour">5 HP</button>
      <button data-cmd="schemereload_testvalue health 1500" title="Four digits: do they fit the box?">1500 HP</button>
      <button data-cmd="schemereload_testvalue money 0">$0</button>
      <button data-cmd="schemereload_testvalue money 16000">$16000</button>
      <button data-cmd="schemereload_testvalue clip 0" title="The weapon in hand's magazine empty">Empty mag</button>
      <button data-cmd="schemereload_testvalue roundtime 15" title="A round timer over 10:00, as surf and bhop servers have (starts the round again)">15:00 timer</button>
      <button data-cmd='bot_stop 1; bot_join_team any; bot_prefix "[WWWWWWWWWWWWWWWW]"; bot_quota 24' title="Bots with long names in both teams">Full scoreboard</button>
      <button data-cmd="bot_kill" title="Kills every bot: a line each in the kill feed">Kill feed</button>
      <button data-cmd='bot_prefix ""; bot_kick; bot_join_team T; bot_quota 1; mp_roundtime 9; mp_restartgame 1' title="Back to one frozen bot and a 9:00 round">Reset</button>
    </div>
    <div class="tline">
      <span class="glabel">Guides</span>
      <button id="guide43" aria-pressed="false" title="Dashed lines where a 4:3 screen (1024x768, 1280x960...) ends: parts outside them are off screen there">4:3 edges</button>
    </div>
  </div>
  </div>
  <div class="bar"><input type="search" id="search" placeholder="Search everything, e.g. health, timer, button"></div>
  <div id="status">Starting...</div>
  <div id="list"></div>
</aside>
<datalist id="fontfaces"></datalist>
<div id="picker" hidden><div>
  <h2>Which HUD do you want to edit?</h2>
  <p class="meta">Changes show in game straight away. They are kept when you click Done or Save HUD.</p>
  <div id="hudlist"></div>
  <button id="browse" class="hud">Browse for a HUD folder...<span class="meta">Any folder with resource/ or scripts/ inside</span></button>

// ---------- KeyValues parsing: just enough for .res files, keeping text offsets so edits touch one line ----------
function evalCond(c) {
  const expr = c.slice(1, -1).replace(/\$(WIN32|WINDOWS)\b/g, '1').replace(/\$\w+/g, '0');
  return /^[01!&|() ]*$/.test(expr) ? !!Function('return ' + expr)() : true;
}

function tokenize(text) {
  const out = [];
  let i = 0;
  while (i < text.length) {
    const c = text[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === '/' && text[i + 1] === '/') { const j = text.indexOf('\n', i); i = j < 0 ? text.length : j; continue; }
    if (c === '{' || c === '}') { out.push({ t: c, start: i }); i++; continue; }
    if (c === '[') { const j = text.indexOf(']', i); if (j < 0) break; out.push({ t: 'cond', s: text.slice(i, j + 1) }); i = j + 1; continue; }
    if (c === '"') { const j = text.indexOf('"', i + 1); if (j < 0) break; out.push({ t: 'str', s: text.slice(i + 1, j), start: i + 1, end: j, q: true }); i = j + 1; continue; }
    let j = i;
    while (j < text.length && !/[\s{}"]/.test(text[j])) j++;
    out.push({ t: 'str', s: text.slice(i, j), start: i, end: j, q: false });
    i = j;
  }
  return out;
}

function parse(text) {
  const tk = tokenize(text), entries = [], sections = [], bases = [];
  let k = 0;
  function block(path) {
    while (k < tk.length) {
      const a = tk[k];
      if (a.t === '}') return a.start;
      if (a.t !== 'str') { k++; continue; }
      if (a.s === '#base' || a.s === '#include') { if (tk[k + 1]) bases.push(tk[k + 1].s); k += 2; continue; }
      let b = tk[k + 1], cond = null;
      if (b && b.t === 'cond' && tk[k + 2] && tk[k + 2].t === '{') cond = b.s, b = tk[++k + 1]; // "1" [$WIN32] { ... }
      k += 2;
      if (b && b.t === '{') {
        const e0 = entries.length, s0 = sections.length;
        const close = block([...path, a.s]);
        sections.push({ path: [...path, a.s], close, kstart: a.q ? a.start - 1 : a.start });
        if (cond && !evalCond(cond)) entries.length = e0, sections.length = s0; // a block for another platform
        k++;
      } else if (b && b.t === 'str') {
        let ok = true;
        if (tk[k] && tk[k].t === 'cond') ok = evalCond(tk[k++].s);
        if (ok) entries.push({ path, key: a.s, value: b.s, start: b.start, end: b.end, q: b.q, kstart: a.q ? a.start - 1 : a.start });
      }
    }
    return text.length;
  }
  block([]);
  return { entries, sections, bases };
}

// ---------- model ----------
const isColor = v => /^\s*-?\d+\s+-?\d+\s+-?\d+(\s+-?\d+)?\s*$/.test(v || '');
const sectionOf = e => (e.path[1] || '').toLowerCase();

// Scheme Colors and BaseSettings merged over the #base files, keyed lowercase (KeyValues is case-insensitive).
function tables(f) {
  const colors = new Map(), base = new Map();
  for (const p of [...f.bases, f.parsed]) {
    for (const e of p.entries) {
      const t = sectionOf(e) === 'colors' ? colors : sectionOf(e) === 'basesettings' ? base : null;
      if (t) t.set(e.key.toLowerCase(), { name: e.key, value: e.value });
    }
  }
  return { colors, base };
}
const EMPTY_TABLES = { colors: new Map(), base: new Map() };

// Same lookup order as the game: literal colour, then Colors (not followed further), then BaseSettings.
function resolve(t, v, depth = 0) {
  if (isColor(v)) return v;
  if (depth > 16 || !v) return null;
  const c = t.colors.get(v.toLowerCase());
  if (c) return isColor(c.value) ? c.value : null;
  const b = t.base.get(v.toLowerCase());
  return b ? resolve(t, b.value, depth + 1) : null;
}

// One HudLayout block's settings (own file over #base), keyed lowercase.
function layoutProps(f, id) {

// A picture file's frames (one for a still picture) and each one's time in ms.
async function pictureFrames(file) {

// Writes the picture as <dir>/<name>.vtf/.vmt (power-of-two sizes up to max, smaller for long animations) and returns

async function importPicture(file, name, dir = PICTURES, max = 512) {

  const pow2 = n => 2 ** Math.round(Math.log2(Math.max(4, n)));

  const proxies = frames.length > 1 ? `\t"Proxies"\n\t{\n\t\t"AnimatedTexture"\n\t\t{\n\t\t\t"animatedtexturevar"\t"$basetexture"\n`
    + `\t\t\t"animatedtextureframenumvar"\t"$frame"\n\t\t\t"animatedtextureframerate"\t"${fps}"\n\t\t}\n\t}\n` : '';
  await call('writebin', `${path}.vtf`, await base64(pictureVtf(pixels, w, h)));
  await call('write', `${path}.vmt`, `"UnlitGeneric"\n{\n\t"$basetexture"\t"${material}"\n\t"$translucent"\t"1"\n\t"$vertexcolor"\t"1"\n\t"$vertexalpha"\t"1"\n`
    + `\t"$ignorez"\t"1"\n\t"$no_fullbright"\t"1"\n\t"$nolod"\t"1"\n${proxies}}\n`);
  return { image: material.replace(/^vgui\//, ''), material, aspect: iw / ih, frames: frames.length, proxies };
}

// Where a HUD part can be clicked: its panel, or its "hit" areas (one, or a list) when the panel is bigger than what it
// draws, or ("fit") the area its child panels cover: the hint box is a label sized to the text in a much larger panel.
function clickRects(p, info, W, H) {
  if (p !== p.thing || !info.hud) return [p];
  // a wide panel whose text is drawn in its middle: just that area (in 480-line units)
  if (info.hud.middle) { const [w, h] = info.hud.middle.map(n => n * H / 480); return [{ x: p.x + (p.w - w) / 2, y: p.y + (p.h - h) / 2, w, h }]; }
  if (info.hud.hit) {
    // a full-screen panel draws at a fixed place inside itself, so its areas move with the panel (xpos/ypos)
    const ox = p.w >= W * 0.95 ? p.x : 0, oy = p.h >= H * 0.95 ? p.y : 0;
    return (Array.isArray(info.hud.hit[0]) ? info.hud.hit : [info.hud.hit]).map(h => { const r = rectOf({}, W, H, h); return { ...r, x: r.x + ox, y: r.y + oy }; });
  }
  const kids = info.hud.fit && live ? live.panels.filter(q => q.parent === p && q.w * q.h > 0) : [];
  if (!kids.length) return [p];
  const x = Math.min(...kids.map(q => q.x)), y = Math.min(...kids.map(q => q.y));
  return [{ x, y, w: Math.max(...kids.map(q => q.x + q.w)) - x, h: Math.max(...kids.map(q => q.y + q.h)) - y }];
}

// Click in the preview: the smallest panel under the mouse, skipping containers and fullscreen overlays.
function pickAt(fx, fy) {
  if (!live) {
    const b = boxList().boxes.filter(b => fx >= b.r.x / boxList().W && fx <= (b.r.x + b.r.w) / boxList().W && fy >= b.r.y / boxList().H && fy <= (b.r.y + b.r.h) / boxList().H)
      .sort((a, b) => a.r.w * a.r.h - b.r.w * b.r.h)[0];
    return b ? { thing: b.thing, info: b.info, control: null } : null;
  }
  const x = fx * live.W, y = fy * live.H;
  let best = null;
  for (const p of live.panels) {
    if (!p.thing || p.w * p.h <= 0 || CONTAINERS.has(p.key) || p.key.startsWith('frame_') && p.key.endsWith('grip')) continue;
    const info = thingInfo(p.thing);
    if (!info || (p === p.thing && NO_CLICK.has(p.key))) continue;
    const r = clickRects(p, info, live.W, live.H).find(r => x >= r.x && y >= r.y && x <= r.x + r.w && y <= r.y + r.h);
    if (!r) continue;
    const area = r.w * r.h, layer = p.module === 'ClientDLL' ? 0 : 1; // menus and the console draw above the HUD
    if (area > 0.9 * live.W * live.H && p !== p.thing) continue;
    if (!best || layer > best.layer || (layer === best.layer && area < best.area)) best = { p, info, area, layer, r };
  }
  if (!best) return null;
  // the control is the nearest panel (clicked one or a parent) that is a known control type; not inside HUD parts (but
  // the chat: its filter button, scroll bar and history) or the main menu
  let c = best.p;
  while (c && c !== best.p.thing && !controlOf(c.cls)) c = c.parent;
  const control = (best.info.kind === 'window' && best.info.id !== 'gamemenu' || best.info.id === 'HudChat') && c && c !== best.p.thing ? c : null;
  return { thing: best.p.thing, info: best.info, control, node: best.p !== best.p.thing ? best.p : null, r: best.r };
}

// The sidebar's own words (section titles, row names, descriptions) can be renamed: double-click one. Kept in this

// The colour picker: a square for shade, a bar for hue, a bar fading the colour from 100% to 0% opacity, the numbers,
// and Copy / Paste ("R G B A", also takes #hex and rgb()). Opens from either swatch of a colour row.
let cpop = null, colourClip = '';
const closePicker = () => { if (cpop) { cpop.remove(); cpop = null; } };
document.addEventListener('pointerdown', e => { if (cpop && !cpop.contains(e.target) && !e.target.closest('.swatch')) closePicker(); });

function openPicker(anchor, rgba, onPick, owner) {
  closePicker();

  const pop = cpop = el('div', { className: 'cpop' });
  pop.owner = owner;
  const sv = el('div', { className: 'sv' }), hue = el('div', { className: 'bar hue' }), alpha = el('div', { className: 'bar alpha' });
  const knobs = [sv, hue, alpha].map(b => b.appendChild(el('i')));
  const prev = el('div', { className: 'prev' }), nums = el('div', { className: 'nums' });
  const fields = ['R', 'G', 'B', 'A %'].map((n, i) => {
    const input = el('input', { type: 'number', min: 0, max: i < 3 ? 255 : 100, step: 1 });
    input.setAttribute('aria-label', n);
    const lab = el('label');
    lab.append(input, el('span', { textContent: n }));

  });

  const show = from => {
    const rgb = c.slice(0, 3).join(' ');
    sv.style.setProperty('--h', `hsl(${h} 100% 50%)`);
    knobs[0].style.cssText = `left:${s * 100}%;top:${(1 - v) * 100}%;background:rgb(${rgb})`;
    knobs[1].style.left = `${h / 3.6}%`;
    knobs[2].style.left = `${(1 - c[3] / 255) * 100}%`;
    alpha.style.setProperty('--c', `rgb(${rgb})`);
    prev.style.setProperty('--c', `rgb(${rgb} / ${c[3] / 255})`);
    fields.forEach((f, i) => { if (f !== from) f.value = i < 3 ? c[i] : Math.round(c[3] / 2.55); });
  };

  const drag = (bar, fn) => {
    const at = e => { const r = bar.getBoundingClientRect(); fn(clamp((e.clientX - r.left) / r.width), clamp((e.clientY - r.top) / r.height)); emit(); };
    bar.onpointerdown = e => { bar.setPointerCapture(e.pointerId); at(e); bar.onpointermove = at; };
    bar.onpointerup = () => { bar.onpointermove = null; };

    if (f.value === '') return;
    if (i < 3) { c[i] = Math.round(clamp(+f.value, 0, 255)); const n = toHsv(c); if (n[1]) h = n[0]; [s, v] = n.slice(1); }

    colourClip = c.join(' ');

    if (!p) return flash(paste, 'No colour');
    c = p;
    const n = toHsv(c);

    [s, v] = n.slice(1);
    emit();
    flash(paste, 'Pasted');
  };

  foot.append(prev, copy, paste);
  pop.append(sv, hue, alpha, nums, foot);
  show();
  document.body.append(pop);
  const r = anchor.getBoundingClientRect();
  pop.style.left = `${clamp(r.left - 20, 8, innerWidth - pop.offsetWidth - 8)}px`;
  pop.style.top = `${r.bottom + pop.offsetHeight + 12 > innerHeight ? Math.max(8, r.top - pop.offsetHeight - 6) : r.bottom + 6}px`;
}

// Each colour row's value when the HUD was opened, by what the row is: its Undo goes back to that (for a new HUD, the
// defaults it started with). Cleared when a HUD is opened.
const loadedColours = {};
// A colour: its RGB over a swatch of it, its opacity over a second swatch (the colour over a checkerboard), both opening
// the picker, then its name and what it's for, and at the far right Undo and Default. where: the file and block it is
// in, so rows with the same name in different places keep their own Undo.
function colorRow(label, note, value, onChange, keys = [], onReset = null, where = '') {
  let rgba = toRgba(value);
  const first = loadedColours[`${where}|${label}|${note}|${keys.join('+')}`] ??= rgba.join(' ');
  const row = el('div', { className: 'row colour' });
  const rgbText = el('div', { className: 'val' }), swatch = el('button', { className: 'swatch' });
  const aText = el('div', { className: 'val' }), aBtn = el('button', { className: 'swatch aswatch' });
  const pick = el('div', { className: 'pick' }), alpha = el('div', { className: 'pick alpha' }), name = el('div', { className: 'name' }), meta = el('div', { className: 'meta' });
  const undo = el('button', { className: 'reset', textContent: 'Undo', title: `Back to ${first}, as it was when the HUD was opened` });
  const show = () => {
    const rgb = rgba.slice(0, 3).join(' ');
    rgbText.textContent = rgb;
    aText.textContent = `${Math.round(rgba[3] / 2.55)}%`;
    swatch.style.setProperty('--c', `rgb(${rgb})`);
    aBtn.style.setProperty('--c', `rgb(${rgb} / ${rgba[3] / 255})`);
    swatch.title = `${rgb}: click to change`;
    aBtn.title = `Opacity ${aText.textContent}: click to change`;
    undo.disabled = rgba.join(' ') === first;
  };
  const set = c => { rgba = c; show(); onChange(rgba.join(' ')); };

  swatch.onclick = aBtn.onclick = e => cpop && cpop.owner === row ? closePicker() : openPicker(e.currentTarget, rgba, set, row);
  aBtn.onkeydown = e => {
    const d = { ArrowRight: 13, ArrowUp: 13, ArrowLeft: -13, ArrowDown: -13 }[e.key];
    if (d) { e.preventDefault(); set([...rgba.slice(0, 3), clamp(rgba[3] + d, 0, 255)]); }
  };
  undo.onclick = () => { closePicker(); set(toRgba(first)); };
  pick.append(rgbText, swatch);
  alpha.append(aText, aBtn);
  name.append(renameable(label));
  if (note) meta.append(renameable(note));

  text.append(name, meta);

  row.dataset.keys = keys.join(' + '); // shown over the section's title (see card)
  row.append(pick, alpha, text, acts);
  show();
  row.dataset.q = `${label} ${note} ${keys.join(' ')}`.toLowerCase();
  return row;
}

const ANCHOR = { xpos: { '': 'from the left', r: 'from the right', c: 'from the centre' }, ypos: { '': 'from the top', r: 'from the bottom', c: 'from the centre' },

const loadedPos = {};

    ? +layoutProps(lay, id)[key === 'xpos' ? 'wide' : 'tall'] : null;

  row.append(el('div', { textContent: label }), input, pct);
  row.dataset.q = label.toLowerCase();
  return row;
}

function noteRow(text) {
  const row = el('div', { className: 'row note meta' });
  row.append(renameable(text));
  row.dataset.q = '';
  return row;
}

function checkRow(label, checked, onChange) {
  const row = document.createElement('label');
  row.className = 'row check';
  row.innerHTML = `<input type="checkbox"${checked ? ' checked' : ''}><div></div>`;
  row.lastElementChild.textContent = label;
  row.firstElementChild.onchange = e => onChange(e.target.checked);
  row.dataset.q = label.toLowerCase();
  return row;
}

function schemeRows(file, list, after = null) {
  const f = F(file);
  if (!f) return [];
  const t = tables(f);
  return list.map(([label, keys, note = '']) => {
    const ks = keys.split('|'), value = resolve(t, ks[0]);
    // values the HUD sets itself can go back to the default one from its #base file
    const own = f.parsed.entries.filter(e => e.path.length === 2 && /^(colors|basesettings)$/i.test(e.path[1]) && ks.some(k => k.toLowerCase() === e.key.toLowerCase()));
    const reset = own.length && f.bases.length ? () => { own.forEach(e => save(f, e.key, null, [e.path[1]])); refreshSoon(); } : null;
    return value && colorRow(label, note || DESCRIBE[ks[0].toLowerCase()] || '', value, v => { ks.forEach(k => save(f, k, v)); if (after) after(ks); }, ks, reset, file);
  }).filter(Boolean);
}

// Rows for a HUD part: its colours, HudLayout colours, box and position/size.
function hudRows(id, hud) {
  // colours the part's own settings only take from the scheme at startup: name them in HudLayout so a reload looks again
  const link = ks => {
    const lay = F(L), p = lay ? layoutProps(lay, id) : {};
    for (const [v, k] of Object.entries(hud.links || {})) if (ks.includes(k) && (p[v.toLowerCase()] || '').toLowerCase() !== k.toLowerCase()) save(lay, v, k, id);
  };
  const rows = [...(hud.fixed ? [noteRow(hud.fixed)] : []), ...schemeRows(hud.scheme || C, hud.colours || [], hud.links ? link : null)];
  const lay = F(L), cs = F(C), t = cs ? tables(cs) : EMPTY_TABLES;
  if (!lay) return rows;
  const p = layoutProps(lay, id);
  for (const [label, key, fallback] of hud.layoutColours || []) {
    const v = resolve(t, p[key.toLowerCase()] || fallback);
    if (v) rows.push(colorRow(label, ` for this part only`, v, v2 => save(lay, key, v2, id), [key], null, id));
  }
  if (canHide(id)) rows.unshift(...visibilityRows(id));
  // hud.rounded: the game draws the box itself (the chat, the timer, weapon selection); its colour is listed above
  if ('paintbackgroundtype' in p || hud.rounded) rows.push(...boxRows(lay, id, p, t, hud));
  // fonts the part's code reads from HudLayout by name (read again on every reload)
  for (const [label, keys, dflt] of hud.fontKeys || []) {
    const ks = keys.split('|'), now = p[ks[0].toLowerCase()] || dflt, names = fontNames(C);
    if (!names.some(n => n.toLowerCase() === now.toLowerCase())) names.push(now);
    rows.push(selectRow(label, names.sort().map(n => [n, n]), names.find(n => n.toLowerCase() === now.toLowerCase()),
      v => { ks.forEach(k => save(lay, k, v, id)); refreshSoon(); }, [ks[0]]));
  }
  for (const [k, label] of [['xpos', 'X position'], ['ypos', 'Y position'], ['wide', 'Width'], ['tall', 'Height']])
    if ((k in p || ((hud.pos || canHide(id)) && k.endsWith('pos'))) && !(hud.lockX && k === 'xpos')) rows.push(numRow(lay, id, k, label, p[k]));
  return rows;
}

// A part's own settings (hud.settings, see INSIDE), each at the HUD's value or the game's default.
function hudSettingRows(id, hud) {
  const lay = F(L);
  if (!lay || !hud.settings) return [];
  const p = layoutProps(lay, id);
  return hud.settings.map(([label, keys, kind, dflt, note = '']) => {
    const ks = keys.split('|'), now = p[ks[0].toLowerCase()] ?? dflt, set = v => ks.forEach(k => save(lay, k, v, id));
    const row = kind === 'onoff' ? toggleRow(label, now !== '0', on => set(on ? '1' : '0'), note)
      : Array.isArray(kind) ? selectRow(label, kind.some(([v]) => v === now) ? kind : [...kind, [now, now]], now, set, ks)
      : inputRow(label, now, set, { type: 'number', step: kind === 'time' ? 0.05 : 1, ...(note ? { title: note } : {}) });
    row.dataset.keys = ks.join(' + ');
    row.dataset.q += ` ${ks.join(' ').toLowerCase()}`;
    return row;
  });
}

// ---------- hiding HUD parts ----------
// "alpha" fades a part and everything in it (0 hides it). The game animates the alpha of these itself
// (hudanimations.txt), so they are hidden by moving them off screen instead, keeping their position in
// "xpos_hudeditor" (a key the game ignores). Values stay in a running game until set again, so showing a part
// writes alpha 255 rather than removing the key.
const SELF_FADING = new Set(['HudHintDisplay', 'HudHintKeyDisplay', 'HudWeaponSelection', 'HudMenu', 'HudHistoryResource']);
const isHidden = id => { const p = layoutProps(F(L), id); return SELF_FADING.has(id) ? 'xpos_hudeditor' in p : p.alpha !== undefined && +p.alpha === 0; };
// Only parts HudLayout sets up can be hidden this way (the centre print isn't one of them).
const canHide = id => !!F(L) && Object.keys(layoutProps(F(L), id)).length > 0;

function setHidden(id, hide) {
  const lay = F(L);
  if (!SELF_FADING.has(id)) return save(lay, 'alpha', hide ? '0' : '255', id);
  moveOff(lay, id, 'xpos', '9999', hide);
}

// After a change that alters which rows or tags show: redraw once it's written.
const refreshSoon = async () => { await sleep(400); await writing; render(); drawBoxes(); };

function visibilityRows(id) {
  const lay = F(L), p = layoutProps(lay, id), rows = [checkRow('Show on screen', !isHidden(id), on => { setHidden(id, !on); refreshSoon(); })];
  if (SELF_FADING.has(id)) rows.push(noteRow('The game fades this one in and out itself, so it can only be shown or hidden.'));
  else rows.push(rangeRow('Opacity', p.alpha ?? '255', v => save(lay, 'alpha', v, id)));
  return rows;
}

// ---------- box corners ----------
// PaintBackgroundType 0 draws a square box, 2 a rounded one; its corners are the images Texture1-4 (by default
// vgui/hud/8x800corner1-4). Boxes the game's own code draws (hud.rounded) are always "rounded", so they go square
// with plain square corner images instead. The timer's box (hud.roundOnly) is drawn by a part HudLayout can't reach.
const ROUND_CORNERS = 'vgui/hud/8x800corner';
const squareTex = p => /square_corner1$/i.test(p.texture1 || '');
async function setCorners(lay, id, square, drawn) {
  try {
    const base = square ? await call('corners', 'square') : ROUND_CORNERS;
    // written even to put the defaults back: values HudLayout no longer sets stay in a running game
    for (let i = 1; i <= 4; i++) save(lay, `Texture${i}`, base + i, id);
    if (!drawn) { save(lay, 'PaintBackgroundType', square ? '0' : '2', id); if (!square) save(lay, 'RoundedCorners', '15', id); }
    // a panel with a "border" takes its box shape from the border, and a running game keeps a border once set
    if (!drawn && layoutProps(lay, id).border !== undefined) {
      save(lay, 'border', null, id);
      save(lay, 'paintborder', null, id);
      alert('Restart the game to see the new corners.\n\nThis part had a border, which sets its box shape. The border is taken out, but the game only lets go of it when it restarts.');
    }
  } catch (err) { status(err.message); }
  refreshSoon();
}

// An earlier editor made every default-rounded box square by replacing the game's corner material in the HUD.
const CORNER_VMT = n => `materials/vgui/hud/8x800corner${n}.vmt`;
let squareAll = false;
function removeSquareAll() {
  squareAll = false;
  writing = writing.then(async () => {
    try {
      for (let n = 1; n <= 4; n++) await call('write', CORNER_VMT(n), `"UnlitGeneric"\n{\n\t"$basetexture" "vgui/hud/8x800corner${n}"\n`
        + '\t"$translucent" "1"\n\t"$vertexcolor" "1"\n\t"$vertexalpha" "1"\n\t"$ignorez" "1"\n\t"$no_fullbright" "1"\n}\n');
      await call('cmd', '', 'mat_reloadmaterial 8x800corner');
      setDirty(true);
      status('Changed in game. Click Done or Save HUD to keep it.');
    } catch (err) { status(`Couldn't apply: ${err.message}`); }
    render();
  });
}

function boxRows(lay, id, p, t, hud) {
  const rows = [];
  if (!hud.rounded) {
    const bg = (p.bgcolor_override && resolve(t, p.bgcolor_override)) || resolve(t, 'Panel.BgColor') || '0 0 0 0';
    rows.push(colorRow('Box background', 'The box drawn behind this part only', bg, v => save(lay, 'bgcolor_override', v, id), ['bgcolor_override'], null, id));
  }
  const type = hud.rounded ? '2' : p.paintbackgroundtype || '0';
  const value = type === '0' || (type === '2' && squareTex(p)) ? 'square' : type === '2' ? 'round' : 'other';
  const opts = [['round', 'Rounded'], ['square', 'Square', hud.roundOnly]];
  if (value === 'other') opts.push(['other', 'As the HUD has it']);
  rows.push(selectRow('Corners', opts, value, v => { if (v !== 'other') setCorners(lay, id, v === 'square', hud.rounded); }, ['PaintBackgroundType', 'Texture1-4']));
  if (hud.roundOnly) rows.push(noteRow('The game always draws this box rounded.'));
  if (squareAll) {
    const b = el('button', { textContent: 'Remove it' });
    b.onclick = removeSquareAll;
    const r = noteRow('This HUD has the old "square corners everywhere" setting, so rounded boxes still look square. ');
    r.append(b);
    rows.push(r);
  }
  return rows;
}

// ---------- borders ----------
// Which borders each control asks its scheme for (vgui_controls sources), by CONTROLS key.
const BORDER_USE = { // [what the border goes round, as a section title, border name]
  Button: [['Buttons', 'ButtonBorder'], ['Buttons with keyboard focus', 'ButtonKeyFocusBorder'], ['Buttons while pressed', 'ButtonDepressedBorder']],
  TextEntry: [['Text fields', 'ButtonDepressedBorder']], ListPanel: [['Lists', 'ButtonDepressedBorder']], SectionedListPanel: [['Lists', 'ButtonDepressedBorder']],
  ProgressBar: [['Progress bars', 'ButtonDepressedBorder']], Menu: [['Menus', 'MenuBorder']], MenuItem: [['Menus', 'MenuBorder']],
  ScrollBar: [['Scroll bar arrows', 'ScrollBarButtonBorder'], ['Scroll bar arrows while pressed', 'ScrollBarButtonDepressedBorder']],
  ScrollBarSlider: [['Scroll bar handle', 'ButtonBorder']], Slider: [['Slider knob', 'ButtonBorder'], ['Slider track', 'ButtonDepressedBorder']],
  PropertySheet: [['Tabs', 'TabBorder'], ['Selected tab', 'TabActiveBorder'], ['Tab page', 'PropertySheetBorder']],
  ComboBoxButton: [['Drop-down arrow', 'ScrollBarButtonBorder']],
};
BORDER_USE.BuyMouseOverPanelButton = BORDER_USE.Button;
// Everything else that asks for the same name, so it's clear what else an edit changes.
const BORDER_SHARED = {
  ButtonBorder: 'buttons, slider knobs, scroll bar handles', ButtonDepressedBorder: 'text fields, lists, progress bars, slider tracks',
  ScrollBarButtonBorder: 'scroll bar arrows, drop-down arrows', MenuBorder: 'menus', FrameBorder: 'every window', HudEditorOutline: 'every HUD part with an outline',
};
const SIDES = ['Left', 'Top', 'Right', 'Bottom'];

// What a border name comes to in a scheme file, as the game resolves it: the block it ends at (following names
// that point at another border; undefined names fall back to BaseBorder), own file over #base.
function borderOf(file, name) {
  const f = F(file), low = s => s.toLowerCase();
  if (!f) return null;
  const isBlock = (p, n) => p.sections.some(s => s.path.length === 3 && low(s.path[1]) === 'borders' && low(s.path[2]) === low(n));
  const aliasOf = (p, n) => p.entries.find(e => e.path.length === 2 && low(e.path[1]) === 'borders' && low(e.key) === low(n));
  for (let n = name, hops = 0; hops < 8; hops++) {
    let next = null;
    for (const p of [f.parsed, ...f.bases]) {
      if (isBlock(p, n)) return { name: n, ...readBorder(f, n) };
      const a = aliasOf(p, n);
      if (a) { next = a.value; break; }
    }
    if (!next && low(n) === 'baseborder') return null;
    n = next || 'BaseBorder';
  }
  return null;
}

// A border block merged the way #base merges it: { props: {inset, backgroundtype...}, sides: {Left: [{color, offset}]...}, base: lines per side in #base }.
function readBorder(f, n) {
  const low = s => s.toLowerCase(), props = {}, sides = {}, base = {};
  for (const s of SIDES) sides[s] = {}, base[s] = 0;
  [...f.bases].reverse().concat([f.parsed]).forEach((p, i, all) => {
    for (const e of p.entries) {
      if (e.path.length < 3 || low(e.path[1]) !== 'borders' || low(e.path[2]) !== low(n)) continue;
      if (e.path.length === 3) { props[low(e.key)] = e.value; continue; }
      const side = SIDES.find(s => low(s) === low(e.path[3]));
      if (e.path.length !== 5 || !side) continue;
      (sides[side][e.path[4]] ||= {})[low(e.key)] = e.value;
      if (i < all.length - 1) base[side] = Math.max(base[side], Object.keys(sides[side]).length);
    }
  });
  for (const s of SIDES) sides[s] = Object.values(sides[s]);
  return { props, sides, base };
}

// The border as tick boxes: which sides draw, how many pixels thick and one colour (mixed: the HUD's sides differ).
function borderState(b, t) {
  const col = l => resolve(t, l.color || '') || '0 0 0 0';
  const shown = SIDES.map(s => (b ? b.sides[s] : []).filter(l => toRgba(col(l))[3] > 0));
  const colours = [...new Set(shown.flat().map(col))];
  return { on: Object.fromEntries(SIDES.map((s, i) => [s, shown[i].length > 0])), n: Math.max(1, ...shown.map(v => v.length)),
    colour: colours[0] || '255 255 255 255', mixed: colours.length > 1 };
}

// Whether any border in a scheme (its own blocks over #base's, as the game merges them) still draws with one of these
// named colours. A border set with the side tick boxes has its colour written in, so it no longer follows them, and
// once none does, the scheme colour (Border.Bright, Border.Dark) changes nothing.
function bordersUse(file, names) {
  const f = F(file), low = s => s.toLowerCase(), want = names.map(low), blocks = new Set();
  if (!f) return false;
  for (const p of [f.parsed, ...f.bases]) for (const s of p.sections) if (s.path.length === 3 && low(s.path[1]) === 'borders') blocks.add(s.path[2]);
  return [...blocks].some(n => SIDES.some(s => readBorder(f, n).sides[s].some(l => want.includes(low(l.color || '')))));
}

// The block for that state. Every side is written, with a clear line where nothing should draw: a running game keeps
// the lines of a side the file no longer lists, and #base's extra lines would merge back in.
function borderBody(st, b) {
  const n = Math.max(1, Math.min(8, +st.n || 1));
  const body = [['inset', SIDES.map(s => st.on[s] ? n : 0).join(' ')]]; // left top right bottom
  if (b && b.props.backgroundtype) body.push(['backgroundtype', b.props.backgroundtype]);
  for (const s of SIDES) {
    const count = Math.max(n, (b && b.base[s]) || 0, (b && b.sides && b.sides[s].length) || 0);
    body.push([s, Array.from({ length: count }, (_, i) => [String(i + 1), [['color', st.on[s] && i < n ? st.colour : '0 0 0 0'], ['offset', '0 0']]])]);
  }
  return body;
}

// The resolved border copied as-is, with some top-level values changed (e.g. backgroundtype).
function copyBorder(b, change) {
  const props = { ...(b ? b.props : {}), ...change };
  const body = Object.entries(props).map(([k, v]) => [k, v]);
  for (const s of SIDES) if (b && b.sides[s].length) body.push([s, b.sides[s].map((l, i) => [String(i + 1), Object.entries(l)])]);
  return body;
}

function borderRows(file, name) {
  const f = F(file), t = tables(f), b = borderOf(file, name), cur = borderState(b, t);
  // the block as it is when written: another row (window corners) may have changed it since this list was drawn
  const write = () => save(f, name, () => {
    const now = borderOf(file, name), own = now && now.name.toLowerCase() === name.toLowerCase();
    return borderBody(cur, own ? now : { props: now ? now.props : {}, base: readBorder(f, name).base, sides: now ? now.sides : null });
  }, ['Borders']);
  const sides = el('div', { className: 'row sides' });
  sides.append(el('div', { textContent: 'Sides' }), ...['Top', 'Left', 'Right', 'Bottom'].map(s => {
    const l = el('label'), box = el('input', { type: 'checkbox', checked: cur.on[s], onchange: () => { cur.on[s] = box.checked; write(); } });
    l.append(box, s);
    return l;
  }));
  sides.dataset.q = 'border sides top left right bottom';
  const rows = [sides,
    inputRow('Thickness', String(cur.n), v => { cur.n = v; write(); }, { type: 'number', min: 1, max: 8, step: 1, title: 'pixels' }),
    colorRow('Colour', 'The ticked sides', cur.colour, v => { cur.colour = v; write(); }, [name])];
  const notes = [cur.mixed && 'The HUD gives this border more than one colour; a change here makes every side this colour.',
    b && b.name.toLowerCase() !== name.toLowerCase() && `Now the same as ${b.name}; a change here gives this one its own.`,
    BORDER_SHARED[name] && `Also changes ${BORDER_SHARED[name]}.`].filter(Boolean);
  if (notes.length) rows.push(noteRow(notes.join(' ')));
  return rows;
}

// Square or rounded windows: FrameBorder's backgroundtype. Where FrameBorder isn't its own block, it becomes one
// copied from what windows use now, so they keep their edge lines.
function windowCornerRow(file) {
  const f = F(file), b = borderOf(file, 'FrameBorder');
  return selectRow('Window corners', [['2', 'Rounded'], ['0', 'Square']], b && b.props.backgroundtype === '2' ? '2' : '0',
    v => save(f, 'FrameBorder', () => copyBorder(borderOf(file, 'FrameBorder'), { backgroundtype: v }), ['Borders']), ['FrameBorder']);
}

// The control type, in context: the buy menu's buttons are the same class as team select's but draw text with Label.TextColor.
function controlIn(p, thing) {
  if (p.cls === 'MouseOverButton' && thing && thing.key.startsWith('buy')) return CONTROLS.find(([k]) => k === 'BuyMouseOverPanelButton');
  // a scroll bar's arrows report themselves as plain Buttons but draw with the scroll bar's colours
  if (p.cls === 'Button' && p.parent && p.parent.cls.endsWith('ScrollBar')) return controlOf(p.parent.cls);
  return controlOf(p.cls);
}

// The clicked control's own block in the window's .res file (walking up to its parents if it has none).
// Rows made from a template get their own names (scoreboard: block "CTPlayerName0" -> panel "_CT_playername0",
// "CTPlayerLatency0" -> "_CT_playerping0"), so names are compared without case or underscores.
function ownBlock(sel) {
  const norm = s => s.toLowerCase().replace(/_/g, '').replace('ping', 'latency');
  const blocks = sel.res.parsed.sections.filter(s => s.path.length === 2).map(s => s.path[1]);
  for (let p = sel.node; p && p !== sel.thing; p = p.parent) {
    const block = p.name && blocks.find(b => norm(b) === norm(p.name));
    if (!block) continue;
    const ctl = controlIn(p, sel.thing);
    return { block, ctl: ctl && ctl[0], what: ctl ? ctl[1].toLowerCase() : p.cls.endsWith('ImagePanel') ? 'image' : 'part', defaults: ctl ? ctl[2] : [] };
  }
  return null;
}

const POS = [['xpos', 'X position'], ['ypos', 'Y position'], ['wide', 'Width'], ['tall', 'Height']];

// A single control's settings in a window .res: its own text/background/fill colour (falling back to the
// scheme colour it would otherwise use) and position/size.
const OWN_NOTE = { fgcolor_override: 'Text colour of just this one; overrides the shared colour below',
  bgcolor_override: 'Background of just this one; overrides the shared colour below', fillcolor: 'Colour this shape or image is filled with',
  button: 'Just this button; over the shared colour below' };
// A button paints with its own colour for each state (vgui Button::PerformLayout), which covers fgcolor_override and
// bgcolor_override: it takes these instead.
const BUTTON_OWN = [['defaultFgColor_override', 'Text'], ['defaultBgColor_override', 'Background'], ['armedFgColor_override', 'Text (mouse over)'],
  ['armedBgColor_override', 'Background (mouse over)'], ['depressedFgColor_override', 'Text (clicked)'], ['depressedBgColor_override', 'Background (clicked)']];
function resRows(f, block, defaults, schemeFile, ctl) {
  const p = layoutProps(f, block), sf = F(schemeFile), t = sf ? tables(sf) : EMPTY_TABLES, rows = [];
  const def = label => { const d = defaults.find(([l]) => l === label); return d && resolve(t, d[1]); };
  // a button's rows: what the shared colour is for, of just this one
  const ownNote = label => { const d = defaults.find(([l]) => l === label), s = d && DESCRIBE[d[1].toLowerCase()]; return s ? s.replace(/^Button/, "This button's") : OWN_NOTE.button; };
  const own = (key, label, fallback, note = OWN_NOTE[key]) => {
    const v = (p[key.toLowerCase()] && resolve(t, p[key.toLowerCase()])) || fallback;
    if (v) rows.push(colorRow(label, note, v, v2 => save(f, key, v2, block), [key], null, `${f.name}/${block}`));
  };
  rows.push(showRow(f, block, 'Show on screen'));
  if (PLAYER_ROW.test(block)) rows.push(noteRow('Player rows are placed like this, but coloured from Scoreboard: player rows below.'));
  else {
    if (ctl === 'Button' || ctl === 'BuyMouseOverPanelButton') { for (const [k, label] of BUTTON_OWN) if (def(label)) own(k, label, def(label), ownNote(label)); }
    else { own('fgcolor_override', 'Text', def('Text')); own('bgcolor_override', 'Background', def('Background')); }
    if ('fillcolor' in p) own('fillcolor', 'Fill', null);
    // which font this one control draws with: any font in its scheme (the game reads "font" from the .res)
    const deflt = CONTROL_FONTS[ctl] && CONTROL_FONTS[ctl][0][1];
    if (!CODE_FONTS[block.toLowerCase()] && (p.font || deflt)) rows.push(inputRow('Font', p.font || deflt, v => save(f, 'font', v, block),
      { list: fontList(schemeFile), title: `Just this one; any font in ${schemeFile}` }));
  }
  for (const [k, label] of POS) if (k in p || k.endsWith('pos')) rows.push(numRow(f, block, k, label, p[k]));
  return rows;
}

// Fonts a HUD part draws with by default (HudLayout font keys, when set, win). From telehud's comments and the SDK.
const HUD_FONTS = { HudHealth: ['HudNumbers'], HudArmor: ['HudNumbers'], HudAmmo: ['HudNumbers'], HudAccount: ['HudNumbers'], HudRoundTimer: ['HudNumbers'],
  HudHintDisplay: ['HudHintText'], HudHintKeyDisplay: ['HudHintTextSmall'], CCenterStringLabel: ['Trebuchet24'], HudMessage: ['CenterPrintText'], TargetID: ['TargetID'],
  HudWeaponSelection: ['HudSelectionNumbers', 'HudSelectionText'], HudMenu: ['Default'], HudDeathNotice: ['Default'], HudRadar: ['ChatFont'], HudChat: ['ChatFont'] };

// Fonts a selection draws with, as [scheme file, font, what for]: the control's own .res "font", HudLayout font keys
// and the defaults above for HUD parts, the fonts the game gives some windows, and control types' defaults. With a
// whole window selected, every font its controls use.
function fontsOf(sel) {
  const out = [];
  const add = (file, font, what) => {
    const have = font && out.find(([f, n]) => f === file && n.toLowerCase() === font.toLowerCase());
    if (have) { if (what && !have[2].split(', ').includes(what)) have[2] += `, ${what}`; }
    else if (font && hasFont(file, font)) out.push([file, font, what || '']);
  };
  const file = schemeOf(sel.control || sel.thing);
  if (sel.info.kind === 'hud') {
    const hf = sel.info.hud.scheme || schemeOf(sel.thing), p = layoutProps(F(L), sel.info.id);
    for (const [k, v] of Object.entries(p)) if (/font/.test(k) && !/^font_?size/.test(k)) add(hf, v, k);
    if (!out.length) for (const n of HUD_FONTS[sel.info.id] || []) add(hf, n, '');
    return out;
  }
  if (WINDOW_FONTS[sel.info.id]) { // set by the game's code, whatever the controls' defaults say
    for (const [f, what, names] of WINDOW_FONTS[sel.info.id]) add(f, names.split('|').find(n => hasFont(f, n)), what);
    return out;
  }
  const own = sel.res && sel.node && ownBlock(sel), ownFont = own && layoutProps(sel.res, own.block).font;
  if (ownFont) add(file, ownFont, 'this one');
  if (sel.control) {
    const ctl = controlIn(sel.control, sel.thing), code = CODE_FONTS[sel.control.key];
    for (const [what, font] of code || (ctl && CONTROL_FONTS[ctl[0]] || []).slice(ownFont ? 1 : 0))
      add(file, font.split('|').find(n => hasFont(file, n)), what.toLowerCase());
    return out;
  }
  if (sel.info.file === S && sel.info.id !== 'gamemenu') add(S, resolveString(S, 'FrameTitleBar.Font') || 'Default', 'title');
  if (sel.res) for (const s of sel.res.parsed.sections.filter(s => s.path.length === 2)) {
    const f = layoutProps(sel.res, s.path[1]).font;
    if (f) add(schemeOf(sel.thing), f, s.path[1]);
  }
  for (const p of live ? live.panels.filter(p => p.thing === sel.thing && p !== sel.thing) : []) {
    const ctl = controlIn(p, sel.thing);
    for (const [what, font] of CODE_FONTS[p.key] || ctl && CONTROL_FONTS[ctl[0]] || [])
      add(schemeOf(p), font.split('|').find(n => hasFont(schemeOf(p), n)), !ctl || what.toLowerCase() === ctl[1].toLowerCase() ? what.toLowerCase() : `${ctl[1].toLowerCase()} ${what.toLowerCase()}`);
  }
  return out;
}

const hasFont = (file, font) => !!(F(file) && font && fontVariants(F(file), font).size);
// A BaseSettings string (FrameTitleBar.Font...), own file over #base.
function resolveString(file, key) {
  // the game takes the first of a repeated key (the game's FrameTitleBar.Font is "UiBold", then "DefaultLarge": window
  // titles are UiBold, checked in game), the HUD's own over #base's
  const f = F(file);
  for (const p of f ? [f.parsed, ...f.bases] : []) for (const e of p.entries)
    if (e.path.length === 2 && e.path[1].toLowerCase() === 'basesettings' && e.key.toLowerCase() === key.toLowerCase()) return e.value;
  return null;
}
// Every font a scheme defines, in file order.
function fontNames(file) {
  const f = F(file), seen = new Map();
  for (const p of f ? [...f.bases, f.parsed] : []) for (const e of p.entries)
    if (e.path.length >= 3 && e.path[1].toLowerCase() === 'fonts' && !seen.has(e.path[2].toLowerCase())) seen.set(e.path[2].toLowerCase(), e.path[2]);
  return [...seen.values()];
}
// A <datalist> of a scheme's font names, for font pickers; returns its id.
function fontList(file) {
  const id = `fonts-${file.replace(/\W/g, '')}`;
  let dl = $(id);
  if (!dl) document.body.append(dl = el('datalist', { id }));
  dl.replaceChildren(...fontNames(file).map(n => el('option', { value: n })));
  return id;
}
// Every font of every scheme, for ones nothing on screen uses right now. Filled when opened; stays open.
const FONT_FILES = [[C, 'in game'], [S, 'menus'], [CH, 'chat']];
let openAllFonts = false;
function allFonts() {
  const d = el('details');
  d.append(el('summary', { textContent: 'All fonts' }));
  const fill = () => {
    if (d.childElementCount > 1) return;
    let face = '', weight = '';
    const go = el('button', { textContent: 'Apply to every text font', onclick: () => setAllFonts(face.trim(), weight.trim()) });
    const apply = el('div', { className: 'row check' });
    apply.append(el('span'), go);
    apply.dataset.q = 'every font all fonts';
    d.append(el('div', { className: 'sub', textContent: 'Every text font at once' }),
      inputRow('Font', '', v => { face = v; }, { list: 'fontfaces', title: 'Left empty: faces stay as they are' }),
      inputRow('Weight', '', v => { weight = v; }, { type: 'number', step: 100, min: 0, title: 'Left empty: weights stay' }),
      noteRow('Icon and symbol fonts (weapon icons, the logo, arrows) are left alone. Every screen size is changed.'), apply);
    for (const [file, where] of FONT_FILES) {
      const names = fontNames(file);
      if (names.length) d.append(el('div', { className: 'sub', textContent: `${file} (${where})` }), ...names.map(n => fontFold(file, n, '')));
    }
  };
  d.ontoggle = () => { openAllFonts = d.open; if (d.open) fill(); };
  if (openAllFonts) { d.open = true; fill(); }
  return d;
}

// Faces that draw icons and symbols, not text: "every text font" leaves them alone.
const SYMBOL_FACES = new Set(['marlett', 'counter-strike', 'counter-strike logo', 'cs', 'csd', 'halflife2', 'buttons', 'webdings', 'wingdings']);
// One face and/or weight for every text font in every scheme, each file written once.
async function setAllFonts(face, weight) {
  if (!face && !weight) return status('Type a font, a weight, or both first.');
  let n = 0;
  for (const [file] of FONT_FILES) {
    const f = F(file);
    if (!f) continue;
    commit(f, `${file}/every font`, () => {
      let cur = f;
      for (const font of fontNames(file)) for (const [v, p] of fontVariants(cur, font)) {
        if (SYMBOL_FACES.has((p.name || '').toLowerCase())) continue;
        for (const [k, val] of [['name', face], ['weight', weight]]) {
          if (!val || p[k] === val) continue;
          const text = setAt(cur, ['Fonts', font, v], k, val);
          cur = { ...cur, text, parsed: parse(text) };
        }
        n++;
      }
      return cur.text;
    });
  }
  await writing;
  render();
  status(`${[face, weight && `weight ${weight}`].filter(Boolean).join(', ')} on ${n} font entries. Icon fonts were left alone.`);
}

// A font's settings in a fold, filled when first opened. Open ones stay open across re-renders.
const openFonts = new Set();
function fontFold(file, font, what, open) {
  const d = el('details', { className: 'fold' }), key = `${file}:${font.toLowerCase()}`;
  d.append(el('summary', { textContent: what ? `${font}: ${what}` : font }));
  const fill = () => { if (d.childElementCount === 1) d.append(...fontRows(file, font)); };
  d.ontoggle = () => { if (d.open) { openFonts.add(key); fill(); } else openFonts.delete(key); };
  if (open || openFonts.has(key)) { d.open = true; fill(); }
  d.dataset.q = `${font} ${what} font`.toLowerCase();
  d.dataset.file = file; // for the Fonts card's Add font
  return d;
}


function inputRow(label, value, onChange, attrs = {}) {
  const row = el('div', { className: 'row num' });
  const input = el('input', { value });
  for (const [k, v] of Object.entries(attrs)) input.setAttribute(k, v); // "list" can only be set as an attribute
  input.setAttribute('aria-label', label);
  input.oninput = () => { if (input.value !== '') onChange(input.value); };
  let box = input;
  if (attrs.type === 'number') { // - and + beside the box instead of the browser's arrows inside it
    const step = (up, text) => el('button', { textContent: text, tabIndex: -1, title: up ? 'Up' : 'Down',
      onclick: () => { try { up ? input.stepUp() : input.stepDown(); } catch { return; } input.oninput(); } });
    box = el('div', { className: 'step' });
    box.append(step(false, '−'), input, step(true, '+'));
  }
  const name = el('div'), meta = el('div', { className: 'meta' });
  name.append(renameable(label));
  if (attrs.title) meta.append(renameable(attrs.title));
  row.append(name, box, meta);
  row.dataset.q = label.toLowerCase();
  return row;
}

// On/off, in the same column as the number boxes: Off | On, the lit half is the setting. row.set(on) shows a new value.
function toggleRow(label, on, onChange, note = '') {
  const row = el('div', { className: 'row num' }), seg = el('div', { className: 'seg', role: 'group' });
  const halves = ['Off', 'On'].map((t, i) => el('button', { textContent: t, onclick: () => { if (on !== !!i) { row.set(!!i); onChange(on); } } }));
  row.set = v => { on = v; halves.forEach((b, i) => b.setAttribute('aria-pressed', String(on === !!i))); };
  seg.setAttribute('aria-label', label);
  seg.append(...halves);
  const name = el('div'), meta = el('div', { className: 'meta' });
  name.append(renameable(label));
  if (note) meta.append(renameable(note));
  row.append(name, seg, meta);
  row.set(on);
  row.dataset.q = label.toLowerCase();
  return row;
}

// Font entry settings besides name, size, weight and blur, as the game's scheme loader reads them: always shown, and
// the rest, listed under + until the font has them. [key, label, kind, value when added, note]
const FONT_FLAGS = [['outline', 'Outline'], ['dropshadow', 'Drop shadow'], ['additive', 'Additive (glow)', 'flag', '1', 'Hides outline and shadow'], ['antialias', 'Anti-aliasing']];
const FONT_EXTRA = [['italic', 'Italic', 'flag', '1'], ['underline', 'Underline', 'flag', '1'], ['strikeout', 'Strike-through', 'flag', '1'],
  ['scanlines', 'Scan lines', 'num', '2', 'Dark lines every this many pixels'], ['range', 'Characters', 'text', '0x0000 0x017F', 'Unicode range it covers'],
  ['symbol', 'Symbol font', 'flag', '1', 'For icon fonts like Marlett'], ['rotary', 'Rotary', 'flag', '1', 'Drawn turned (game effect)'], ['custom', 'Custom', 'flag', '1', 'Game-specific drawing']];

// A font's settings for the current screen height. Edits go to that entry only (fonts have one per resolution).
function fontRows(file, font) {
  const f = F(file);
  const vars = f && fontVariants(f, font);
  if (!vars || !vars.size) return [];
  const H = live ? live.H : 1080, v = activeVariant(vars, H), p = vars.get(v);
  const put = (key, val) => save(f, key, val, ['Fonts', font, v]);
  const flags = {};
  const rowFor = ([key, label, kind = 'flag', , note = '']) => kind !== 'flag'
    ? inputRow(label, p[key] ?? '', val => put(key, val), kind === 'num' ? { type: 'number', step: 1, min: 0, title: note } : { title: note })
    : flags[key] = toggleRow(label, +p[key] > 0, on => {
      put(key, on ? '1' : '0');
      // additive text adds light to what's behind it, so black outlines and shadows can't show: turn it off for them
      if (on && (key === 'outline' || key === 'dropshadow') && +(p.additive ?? 0) > 0) { flags.additive.set(false); put('additive', '0'); }
      p[key] = on ? '1' : '0';
    }, note);
  const rows = [
    inputRow('Font', p.name || '', val => put('name', val), { list: 'fontfaces', title: 'Installed or in the HUD' }),
    inputRow('Size', p.tall || '', val => put('tall', val), { type: 'number', step: 1 }),
    inputRow('Weight', p.weight || '400', val => put('weight', val), { type: 'number', step: 100, min: 0 }),
    inputRow('Blur', p.blur || '0', val => put('blur', val), { type: 'number', step: 1, min: 0 }),
    ...FONT_FLAGS.map(rowFor),
    ...FONT_EXTRA.filter(([k]) => k in p).map(rowFor),
  ];
  rows[0].lastElementChild.textContent = vars.size > 1 ? `Entry "${v}", for ${H}p screens` : '';
  // +: the settings this font doesn't have yet; picking one adds it (switched on, or a starting value) and its row
  const add = el('div', { className: 'row addkey' }), plus = el('button', { className: 'plus', textContent: '+', title: 'Add a font setting' });
  const menu = el('div', { className: 'chips', hidden: true });
  const fill = () => menu.replaceChildren(...FONT_EXTRA.filter(([k]) => !(k in p)).map(x => el('button', { textContent: x[1], onclick: () => {
    p[x[0]] = x[3];
    put(x[0], x[3]);
    add.before(rowFor(x));
    fill();
    menu.hidden = plus.hidden = !menu.childElementCount;
  } })));
  plus.onclick = () => { menu.hidden = !menu.hidden; plus.classList.toggle('open', !menu.hidden); };
  fill();
  plus.hidden = !menu.childElementCount;
  add.append(plus, menu);
  add.dataset.q = FONT_EXTRA.map(x => x[1]).join(' ').toLowerCase();
  return [...rows, add];
}

// Copies a font file into the HUD and lists it in CustomFontFiles of the given schemes (the game registers it, live);
// then it can be typed into any Font box.
async function addFontFile(schemes) {
  try {
    const [rel, family] = (await call('addfont')).split('\t');
    for (const f of schemes.map(F).filter(Boolean)) {
      const used = [...f.bases, f.parsed].flatMap(p => p.entries).filter(e => e.path.length === 2 && e.path[1].toLowerCase() === 'customfontfiles');
      if (used.some(e => e.value.replace(/\\/g, '/').toLowerCase() === rel.toLowerCase())) continue;
      save(f, String(Math.max(0, ...used.map(e => +e.key).filter(n => n > 0)) + 1), rel, ['CustomFontFiles']);
    }
    $('fontfaces').prepend(el('option', { value: family }));
    status(`Added "${family}". Type it into any Font box to use it.`);
  } catch (err) {
    if (err.message !== 'cancelled') status(err.message);
  }
}

// The main menu's logo (ClientScheme Main.Title1.Color "COUNTER-STRIKE", Main.Title2.Color "SOURCE") and item
// height (MainMenu.MenuItemHeight, before the game scales it to the screen: 22 is 66 pixels at 1440p).
const LOGO_KEYS = ['Main.Title1.Color', 'Main.Title2.Color'];
function mainMenuSections() {
  const c = F(C), s = F(S), out = [];
  if (c) {
    const t = tables(c), shown = LOGO_KEYS.some(k => toRgba(resolve(t, k) || '0 0 0 0')[3] > 0);
    const byDefault = k => toRgba(resolve(tables({ ...c, parsed: { entries: [], sections: [] } }), k) || '255 255 255 255')[3];
    const show = checkRow('Show the logo', shown, on => {
      for (const k of LOGO_KEYS) {
        const [r, g, b] = toRgba(resolve(tables(c), k) || '255 255 255 255');
        save(c, k, `${r} ${g} ${b} ${on ? byDefault(k) || 255 : 0}`);
      }
      refreshSoon();
    });
    out.push(['Main menu: logo', [show, ...schemeRows(C, [['Logo', LOGO_KEYS[0], '"COUNTER-STRIKE"'], ['Logo, second line', LOGO_KEYS[1], '"SOURCE"']])]]);
    // where GameUI puts the menu and the logo (ClientScheme, in 480-line units): a menu that would reach the bottom gap
    // is lifted, logo and all
    const row = (label, key, note = '') => inputRow(label, (t.base.get(key.toLowerCase()) || {}).value || '0', v => save(c, key, v, ['BaseSettings']), { type: 'number', step: 1, ...(note ? { title: note } : {}) });
    out.push(['Main menu: position', [row('Menu X', 'Main.Menu.X', 'From the left'), row('Menu Y', 'Main.Menu.Y', 'From the top'),
      row('Gap at the bottom', 'Main.BottomBorder', 'The menu stays at least this far above the bottom'), row('Logo X', 'Main.Title1.X'), row('Logo Y', 'Main.Title1.Y'),
      row('Second line X', 'Main.Title2.X'), row('Second line Y', 'Main.Title2.Y')]]);
  }
  const pick = el('input', { type: 'file', accept: 'image/*', hidden: true, onchange: () => { if (pick.files[0]) setBackground(pick.files[0]); pick.value = ''; } });
  const add = el('div', { className: 'row action' });
  add.append(pick, el('button', { className: 'primary', textContent: 'Import a picture…', onclick: () => pick.click() }));
  add.dataset.q = 'background picture image wallpaper import';
  const buttons = menuRows();
  if (buttons.length) out.push(['Main menu: buttons', buttons]);
  out.push(['Main menu: background', [add, noteRow('PNG, JPG, WebP... It is cropped to fill the screen, and shows straight away.')]]);
  const h = s && tables(s).base.get('mainmenu.menuitemheight');
  if (h) out.push(['Main menu: items', [inputRow('Item height', h.value, v => save(s, 'MainMenu.MenuItemHeight', v, ['BaseSettings']),
    { type: 'number', min: 8, max: 80, step: 1, title: 'Scaled to your screen; the game\'s is 22. The text size is the MenuLarge font below' })]]);
  return out;
}

// How long windows take to fade, in seconds: opening and closing, going behind another window, and (menus) changing
// tabs. The game's menus take 0.3 s; its in-game windows (team select, MOTD...) 0.
function fadeRows(file) {
  const f = F(file);
  if (!f) return [];
  const t = tables(f), row = (label, key, note) => {
    const v = t.base.get(key.toLowerCase());
    return v && inputRow(label, v.value, x => save(f, key, x, ['BaseSettings']), { type: 'number', min: 0, max: 3, step: 0.05, title: note });
  };
  return [row('Opening and closing', 'Frame.TransitionEffectTime', 'Seconds; 0 is instant'), row('Going behind another window', 'Frame.FocusTransitionEffectTime', 'Seconds'),
    file === S && row('Changing tabs', 'PropertySheet.TransitionEffectTime', 'Seconds')].filter(Boolean);
}

// Scroll bars' width: ScrollBar.Wide in each scheme (the game's is 17), applied again on a reload.
function scrollWideRow(file) {
  const f = F(file), v = f && tables(f).base.get('scrollbar.wide');
  if (!f) return null;
  const row = inputRow('Scroll bar width', v ? v.value : '17', w => save(f, 'ScrollBar.Wide', w, ['BaseSettings']),
    { type: 'number', min: 0, max: 40, step: 1, title: `${file === CH ? 'The chat' : file === C ? 'In-game windows' : 'Menus'}; the game's is 17` });
  row.dataset.q = 'scroll bar width thin scrollbar';
  return row;
}

// The server browser's pages (Internet uses CustomGamesPage, the other tabs InternetGamesPage). They're made at
// startup, so hiding a part shows after a restart.
const SB_PAGES = ['servers/InternetGamesPage.res', 'servers/CustomGamesPage.res'];
function serverBrowserRows() {
  const fs = SB_PAGES.map(F).filter(Boolean);
  if (!fs.length) return [];
  const row = checkRow('Show the Filters button', !fs.some(f => partHidden(f, 'Filter')), on => {
    for (const f of fs) setPartHidden(f, 'Filter', !on);
    writing = writing.then(() => status('Changed. The server browser shows it after a game restart.'));
  });
  row.dataset.q = 'filters button server browser';
  return [row, noteRow('The server browser reads its layout when the game starts: restart it to see this.')];
}

// Space inside the chat (BaseChat.res, 480-line units; the game's is 10). The history and typing line start this
// far in; their widths come from the chat's (HudLayout HudChat wide), since "f" widths count from the screen. The
// game places the typing line's height and sizes the history down to it itself.
function chatPaddingRows(sel) {
  const f = sel.res, lay = F(L);
  if (!f || !lay) return [];
  const row = inputRow('Padding', layoutProps(f, 'HudChatHistory').xpos || '10', v => {
    const n = Math.max(0, Math.round(+v)), w = Math.max(20, (parseInt(layoutProps(lay, 'HudChat').wide, 10) || 320) - 2 * n);
    for (const b of ['HudChatHistory', 'ChatInputLine']) save(f, 'xpos', String(n), b), save(f, 'wide', String(w), b);
    save(f, 'ypos', String(n), 'HudChatHistory');
  }, { type: 'number', min: 0, max: 40, step: 1, title: 'The game\'s is 10' });
  row.title = 'Space around the messages and typing line. Set it again after changing the chat\'s width.';
  row.dataset.q = 'chat padding space inside';
  return [row];
}

// The main menu's buttons: resource/GameMenu.res, numbered blocks in order. The game reads it once at startup (a
// scheme reload doesn't rebuild the menu). GAME_MENU is the game's own list, to put buttons back from.
const GM = 'resource/GameMenu.res';

  $('launch').hidden = !!live;

  if (keepScores && live && !live.panels.some(p => p.key === 'scores') && Date.now() - scoresSent > 1500) { scoresSent = Date.now(); call('cmd', '', '+showscores'); }
  // the same for the chat (a reload takes it out of typing): the player's chat key opens it again
  if (keepChat && live && !chatOpen() && !chatWatch && Date.now() - chatSent > 4000) { chatSent = Date.now(); chatKeyScan().then(k => call('key', k)).catch(() => {}); }

// Keys pressed with the mouse over the preview go to the game (brought to the front): Esc, ~, Tab, B, movement...
// The game reads scan codes, so KeyboardEvent.code is mapped to them.
const SCAN = { Escape: '01', Backquote: '29', Tab: '0F', Space: '39', Enter: '1C', Backspace: '0E', ShiftLeft: '2A', ShiftRight: '36',
  ControlLeft: '1D', AltLeft: '38', Minus: '0C', Equal: '0D', BracketLeft: '1A', BracketRight: '1B', Semicolon: '27', Quote: '28',
  Backslash: '2B', Comma: '33', Period: '34', Slash: '35', F11: '57', F12: '58' };
[['QWERTYUIOP', 0x10], ['ASDFGHJKL', 0x1E], ['ZXCVBNM', 0x2C]].forEach(([row, first]) => [...row].forEach((c, i) => { SCAN[`Key${c}`] = (first + i).toString(16); }));
[...'1234567890'].forEach((c, i) => { SCAN[`Digit${c}`] = (2 + i).toString(16); });
for (let i = 1; i <= 10; i++) SCAN[`F${i}`] = (0x3A + i).toString(16);
let overPreview = false;
$('preview').onmouseenter = () => { overPreview = true; };
$('preview').onmouseleave = () => { overPreview = false; };
// Down and up go separately, so a key held over the preview stays held in the game (Tab keeps the scoreboard open).
const keysDown = new Set();
document.addEventListener('keydown', e => {
  const typing = document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (!host || !overPreview || typing || e.ctrlKey || !$('picker').hidden || !SCAN[e.code]) return;
  e.preventDefault();
  if (e.repeat || keysDown.has(e.code)) return;
  keysDown.add(e.code);
  call('key', `${SCAN[e.code]} down`).then(() => status(`Sent ${e.key === ' ' ? 'Space' : e.key} to the game.`), err => status(`Couldn't send the key to the game: ${err.message}`));
});
document.addEventListener('keyup', e => {
  // a release without focus is the one the browser makes up when the game comes to the front, not the key's
  if (!keysDown.delete(e.code) || !document.hasFocus()) return;
  e.preventDefault();
  call('key', `${SCAN[e.code]} up`).catch(() => {});
});
// a release the editor never saw (it went to the game) mustn't block the next press
window.addEventListener('focus', () => keysDown.clear());
