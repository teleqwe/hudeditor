// ---------- preview boxes ----------
function boxList() {
  if (live) {
    const boxes = [], sel = selected;
    for (const p of live.panels) {
      if (!p.thing || p !== p.thing) continue;
      const info = thingInfo(p);
      if (!info || NO_CLICK.has(p.key)) continue;
      for (const r of clickRects(p, info, live.W, live.H))
        if (r.w * r.h <= 0.9 * live.W * live.H && r.x < live.W && r.y < live.H && r.x + r.w > 0 && r.y + r.h > 0) boxes.push({ thing: p, info, r, cls: 'thing' });
    }
    if (sel && sel.control) boxes.push({ thing: sel.thing, info: sel.info, r: sel.control, cls: 'sel', label: controlIn(sel.control, sel.thing)[1] });
    return { W: live.W, H: live.H, boxes };
  }
  const v = $('video'), W = v.hidden ? 1920 : v.videoWidth || 1920, H = v.hidden ? 1080 : v.videoHeight || 1080;
  const boxes = []; // no boxes without the game: where things are is only known from the game itself
  return { W, H, boxes };
}

function drawBoxes() {
  const { W, H, boxes } = boxList(), host = $('boxes');
  $('stage').style.setProperty('--aspect', W / H);
  host.innerHTML = '';
  for (const b of boxes) {
    const isSel = selected && (b.cls === 'sel' || (!selected.control && selected.info.id === b.info.id));
    const d = el('div', { className: `box ${b.cls}${isSel ? ' sel' : ''}` });
    Object.assign(d.style, { left: `${b.r.x / W * 100}%`, top: `${b.r.y / H * 100}%`, width: `${b.r.w / W * 100}%`, height: `${b.r.h / H * 100}%` });
    d.append(el('span', { textContent: b.label || b.info.name }));
    host.append(d);
  }
  const hover = el('div', { className: 'box hover', id: 'hoverbox', hidden: true });
  hover.append(el('span'));
  host.append(hover);
}

const stagePoint = e => { const r = $('boxes').getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
// ---------- dragging: moves what is under the mouse ----------
// What places a selection: a HudLayout block (HUD parts) or its own block in the window's .res (window controls), and
// how many screen pixels one unit is (worked out from the panel's real width, else the height / 480 the game scales
// by). null where the game places it itself (the main menu, the server browser...).
function moveTarget(sel) {
  if (!sel || !live) return null;
  let f, block, panel;
  if (sel.info.kind === 'hud' && !sel.control) {
    f = F(L); block = sel.info.id; panel = sel.thing;
  } else {
    const own = sel.res && sel.node && ownBlock(sel);
    if (!own) return null;
    f = sel.res; block = own.block;
    panel = live.panels.find(q => q.thing === sel.thing && q.name && q.name.toLowerCase() === block.toLowerCase());
  }
  const p = f && layoutProps(f, block);
  if (!p || !Object.keys(p).length || 'xpos_hudeditor' in p) return null; // hidden parts sit off screen
  const wide = /^\s*\d+\s*$/.test(p.wide || '') ? +p.wide : 0, s = panel && wide && panel.w ? panel.w / wide : live.H / 480;
  return { f, block, p, s, lockX: sel.info.kind === 'hud' && !sel.control && !!sel.info.hud.lockX };
}
// A position moved by d units ("r" counts from the right or bottom, so it goes the other way); null for "f" or junk.
function shifted(raw, d) {
  const m = /^\s*([rc]?)\s*(-?[\d.]+)\s*$/i.exec(raw ?? '0');
  return m ? m[1] + Math.round(+m[2] + (m[1].toLowerCase() === 'r' ? -d : d)) : null;
}
const movable = hit => hit.info.kind === 'hud' && !hit.control ? canHide(hit.info.id) && !isHidden(hit.info.id) : !!UI_RES[hit.thing.key] && !!(hit.control || hit.node);

let drag = null, dragEnded = 0;
const place = (el, r) => { const { W, H } = live; Object.assign(el.style, { left: `${r.x / W * 100}%`, top: `${r.y / H * 100}%`, width: `${r.w / W * 100}%`, height: `${r.h / H * 100}%` }); };
$('boxes').onmousedown = e => {
  if (e.button !== 0 || !live) return;
  const hit = pickAt(...stagePoint(e));

};
window.addEventListener('mousemove', e => {
  if (!drag) return;

  if (!drag.moved) {

    (async () => {

      d.target = moveTarget(selected);

    })();

  if (hb) { hb.hidden = false; hb.classList.add('drag'); place(hb, { ...drag.rect, x: drag.rect.x + (lockX ? 0 : dx), y: drag.rect.y + dy }); }
  const t = drag.target;
  if (!t) return;
  const x = t.lockX ? null : shifted(t.p.xpos, dx / t.s), y = shifted(t.p.ypos, dy / t.s);

  if (y !== null) save(t.f, 'ypos', y, t.block);
});
window.addEventListener('mouseup', () => {
  if (!drag) return;
  if (drag.moved) { dragEnded = Date.now(); refreshSoon(); }
  drag = null;
  $('hoverbox')?.classList.remove('drag');
});
$('boxes').onmousemove = e => {
  const hit = pickAt(...stagePoint(e)), hb = $('hoverbox');
  $('boxes').style.cursor = hit && movable(hit) ? 'move' : '';

  hb.hidden = !hit;
  if (!hit) return;
  const { W, H } = boxList();
  const r = live ? (hit.control || (hit.node ? clickRects(hit.thing, hit.info, W, H)[0] : hit.r)) : rectOf(layoutProps(F(L), hit.info.id), W, H, hit.info.hud.hit);
  Object.assign(hb.style, { left: `${r.x / W * 100}%`, top: `${r.y / H * 100}%`, width: `${r.w / W * 100}%`, height: `${r.h / H * 100}%` });
  hb.firstChild.textContent = hit.control ? `${hit.info.name} › ${controlIn(hit.control, hit.thing)[1]}` : hit.info.name;
};
$('boxes').onmouseleave = () => { if ($('hoverbox') && !drag) $('hoverbox').hidden = true; };
// a drag ends with a click too: that one mustn't pick something else
$('boxes').onclick = e => { if (Date.now() - dragEnded < 300) return; const hit = pickAt(...stagePoint(e)); if (hit) { $('search').value = ''; select(hit); } };

// ---------- the game: live panel list, capture, test server ----------
let pendingRender = false, captured = false, autoTried = false;

let keepScores = false, scoresSent = 0;
async function poll() {
  // capture as soon as the game's window exists (capture picks it by title; earlier than that it would ask instead)
  if (!captured && !autoTried && await call('gamewindow').then(() => true, () => false)) { autoTried = true; await sleep(1500); capture(true); }
  const raw = await call('panels').catch(() => '');
  if (raw === liveRaw) return;
  liveRaw = raw;
  live = raw ? parsePanels(raw) : null;
  $('launch').hidden = !!live;
  // the scoreboard closes when the HUD reloads: open it again while it's being kept open
  if (keepScores && live && !live.panels.some(p => p.key === 'scores') && Date.now() - scoresSent > 1500) { scoresSent = Date.now(); call('cmd', '', '+showscores'); }
  if (selected && live && !live.panels.includes(selected.thing)) {
    // the same thing, found again in the new list (panels are re-read every time). One that is gone stays selected:
    // windows close while the HUD reloads (the scoreboard) and come back
    const again = live.panels.find(p => p === p.thing && p.key === selected.thing.key);
    const ctl = again && selected.control && live.panels.find(p => p.thing === again && p.key === selected.control.key && p.cls === selected.control.cls);
    const node = again && selected.node && live.panels.find(p => p.thing === again && p.key === selected.node.key && p.cls === selected.node.cls);
    if (again) selected = { ...selected, thing: again, info: thingInfo(again) || selected.info, control: ctl || selected.control, node: node || selected.node };
  }
  drawBoxes();
  const busy = document.activeElement && $('list').contains(document.activeElement) && document.activeElement.tagName === 'INPUT';
  if (busy) pendingRender = true; else renderOnScreenOnly();
}
$('list').addEventListener('focusout', () => { if (pendingRender) setTimeout(render); });

// Re-render only when the set of things on screen changed, so the rows being edited stay put.
let shownKey = '';
function renderOnScreenOnly() {
  const key = onScreen().map(t => t.info.id).join();
  if (key !== shownKey) { shownKey = key; render(); }
}

async function capture(auto) {
  try {
    // restores the game if it's minimised: capture only offers windows that are up, and picks the game by title
    if (await call('gamewindow').then(() => true, () => false)) await sleep(300);
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: 'window', frameRate: 60 }, audio: false });
    const v = $('video');
    v.srcObject = stream;
    v.hidden = false;
    $('empty').hidden = true;
    $('capture').hidden = true;
    $('stage').classList.remove('schematic');
    captured = true;
    v.onresize = drawBoxes;
    stream.getVideoTracks()[0].onended = () => {
      v.hidden = true; captured = false; autoTried = false;
      $('empty').hidden = false; $('capture').hidden = false; $('stage').classList.add('schematic'); drawBoxes();
    };
  } catch (err) {
    $('capture').hidden = false;
    if (!auto && err.name !== 'NotAllowedError') status(err.message);
  }
}

const TEST_SETUP = 'disconnect; sv_cheats 1; mp_autokick 0; mp_ignore_round_win_conditions 1; mp_autoteambalance 0; mp_limitteams 0; mp_freezetime 0; mp_roundtime 9; mp_buytime 9999; '
  + 'mp_startmoney 16000; mp_timelimit 0; mp_maxrounds 0; mp_winlimit 0; bot_quota 1; bot_join_team T; bot_stop 1; bot_chatter off; '

// Sample server texts the test game keeps on screen, added up like the plugin's schemereload_testtext:

try { texts = +(localStorage.getItem('texts') ?? 15); } catch {}
const showTexts = () => { for (const b of $('texts').querySelectorAll('button')) b.setAttribute('aria-pressed', !!(texts & b.dataset.bit)); };

async function testServer() {
  if (!live) { status('Start the game first.'); return; }
  status('Starting an offline test game on de_dust2...');

// ---------- HUD picker ----------
async function showPicker(canCancel) {
  const lines = (await call('huds')).split('\n');
  const current = lines.pop().split('\t')[2] || '';
  const huds = lines.filter(Boolean).map(l => l.split('\t'));
  const box = $('hudlist');
  box.innerHTML = '';
  for (const [name, path, where] of huds) {
    const b = el('button', { className: 'hud' + (path.toLowerCase() === current.toLowerCase() ? ' primary' : ''), textContent: name });
    b.append(el('span', { className: 'meta', textContent: `${where === 'custom' ? 'In your custom folder' : 'Recent'} · ${path}` }));
    b.onclick = () => openHud(path);
    box.append(b);
  }
  if (!huds.length) box.append(el('p', { className: 'meta', textContent: 'No HUDs found yet. Browse for yours, or start a new one.' }));
  $('pickclose').hidden = !canCancel;
  $('picker').hidden = false;
}

async function openHud(path) {
  if (dirty && !confirm(`Discard the unsaved changes to ${hudName}?`)) return;
  try {
    hudName = await call('open', path);
    $('picker').hidden = true;
    $('hudbtn').textContent = `HUD: ${hudName}`;
    selected = null;
    undoSteps.length = 0;
    $('undo').disabled = true;
    setDirty(false);
    await loadAll();
    status(live ? `Editing ${hudName}. Click anything in the preview to edit it.` : `Editing ${hudName}.`);
    // the HUD's own font faces first in the font name suggestions
    call('hudfonts').then(list => { for (const n of list.split('\n').filter(Boolean).reverse()) $('fontfaces').prepend(el('option', { value: n })); }).catch(() => {});
  } catch (err) {
    alert(err.message);
  }
}

async function saveHud() {
  await sleep(300);
  await writing;
  try {
    const n = +(await call('save'));
    setDirty(false);
    status(n ? `Saved ${n} file${n > 1 ? 's' : ''} in ${hudName}.` : `Nothing to save: ${hudName} is as it was.`);
    return true;
  } catch (err) {
    status(`Couldn't save: ${err.message}`);
    return false;
  }
}

async function onHostEvent(ev) {
  if (ev !== 'close') return;
  if (dirty) {
    if (confirm(`Save your changes to ${hudName} before closing?`)) { if (!(await saveHud())) return; }
    else if (!confirm('Close without saving? Your changes will be lost.')) return;
  }
  call('quit');
}

// Keys pressed with the mouse over the preview go to the game (brought to the front): Esc, ~, Tab, B, movement...
// The game reads scan codes, so KeyboardEvent.code is mapped to them.
const SCAN = { Escape: '01', Backquote: '29', Tab: '0F', Space: '39', Enter: '1C', Backspace: '0E', ShiftLeft: '2A', ShiftRight: '36',
  ControlLeft: '1D', AltLeft: '38', Minus: '0C', Equal: '0D', BracketLeft: '1A', BracketRight: '1B', Semicolon: '27', Quote: '28',
  Backslash: '2B', Comma: '33', Period: '34', Slash: '35', F11: '57', F12: '58' };
[['QWERTYUIOP', 0x10], ['ASDFGHJKL', 0x1E], ['ZXCVBNM', 0x2C]].forEach(([row, first]) => [...row].forEach((c, i) => { SCAN[`Key${c}`] = (first + i).toString(16); }));
[...'1234567890'].forEach((c, i) => { SCAN[`Digit${c}`] = (2 + i).toString(16); });
for (let i = 1; i <= 10; i++) SCAN[`F${i}`] = (0x3A + i).toString(16);
let overPreview = false;
$('preview').onmouseenter = () => { overPreview = true; };
$('preview').onmouseleave = () => { overPreview = false; };
// Down and up go separately, so a key held over the preview stays held in the game (Tab keeps the scoreboard open).
const keysDown = new Set();
document.addEventListener('keydown', e => {
  const typing = document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (!host || !overPreview || typing || e.ctrlKey || !$('picker').hidden || !SCAN[e.code]) return;
  e.preventDefault();
  if (e.repeat || keysDown.has(e.code)) return;
  keysDown.add(e.code);
  call('key', `${SCAN[e.code]} down`).then(() => status(`Sent ${e.key === ' ' ? 'Space' : e.key} to the game.`), err => status(`Couldn't send the key to the game: ${err.message}`));
});
document.addEventListener('keyup', e => {
  // a release without focus is the one the browser makes up when the game comes to the front, not the key's
  if (!keysDown.delete(e.code) || !document.hasFocus()) return;
  e.preventDefault();
  call('key', `${SCAN[e.code]} up`).catch(() => {});
});
// a release the editor never saw (it went to the game) mustn't block the next press
window.addEventListener('focus', () => keysDown.clear());

async function start() {
  $('empty').innerHTML = '<p><b>Starting Counter-Strike: Source...</b></p><p>The game window shows up here by itself once it has loaded.</p>';
  try {
    const state = await call('start');
    if (state === 'foreign') {
      status('The game is already running without the editor. Quit it, then click Launch game.');
      $('launch').hidden = false;
    } else status(state === 'running' ? 'Game already running.' : 'Starting the game...');
  } catch (err) {
    status(err.message);
    $('launch').hidden = false;
  }
  showPicker(false);
  setInterval(poll, 500);
  call('fontfaces').then(list => { for (const n of list.split('\n')) $('fontfaces').append(el('option', { value: n })); }).catch(() => {});
}

    check(await readHud('resource/nope.res') === null, 'missing file reads as null');
    check(await call('read', '../outside.txt').then(() => false, () => true), 'paths outside the HUD refused');
    check(await call('new', 'myhud').then(() => false, () => true), 'existing HUD not overwritten');
    await call('done', '', 'ok');
  } catch (err) {
    await call('done', '', err.message);
  }
})();
</script>
</body>
