<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUD Editor</title>
<style>
  :root { --bg: #16181c; --panel: #1f2228; --line: #2c3038; --text: #e6e6e6; --dim: #8b919c; --accent: #ffb000; --sel: #4da3ff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 440px; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  #preview { display: flex; align-items: center; justify-content: center; background: #000; min-width: 0; min-height: 0; padding: 8px; }
  #stage { position: relative; max-width: 100%; max-height: 100%; }
  #stage.schematic { width: min(100%, calc((100vh - 16px) * var(--aspect, 1.7778))); aspect-ratio: var(--aspect, 1.7778); background: #0d0e11; border: 1px solid var(--line); }
  video { display: block; max-width: 100%; max-height: calc(100vh - 16px); }
  #boxes { position: absolute; inset: 0; cursor: crosshair; overflow: hidden; } /* a part moved off screen mustn't widen the page */
  .box { position: absolute; border: 1px dashed rgba(255, 176, 0, .45); opacity: 0; transition: opacity .1s; pointer-events: none; }
  .box span { position: absolute; left: -1px; bottom: 100%; display: none; padding: 0 4px; font-size: 11px; white-space: nowrap; background: rgba(0, 0, 0, .8); color: var(--accent); }
  .box.thing { opacity: 0; }
  #stage:hover .box.thing, .schematic .box.thing { opacity: 1; }
  .box.hover { opacity: 1; border: 2px solid var(--accent); background: rgba(255, 176, 0, .12); }
  .box.hover.drag { border-style: dashed; background: rgba(255, 176, 0, .2); }
  .box.sel { opacity: 1; border: 2px solid var(--sel); background: rgba(77, 163, 255, .15); }
  .box.sel span { color: var(--sel); }
  .box.hover span, .box.sel span { display: block; }
  #empty { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px; color: var(--dim); text-align: center; pointer-events: none; }
  #empty p { max-width: 420px; margin: 4px 0; }
  #empty b { color: var(--text); }
  aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  button { background: #2c3038; color: var(--text); border: 1px solid #3a3f49; border-radius: 4px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; border-color: #3a3f49; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  #texts button[aria-pressed="false"] { opacity: .5; text-decoration: line-through; }
  button[aria-pressed="true"] { border-color: var(--accent); }
  #hudbtn { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input[type=search], input[type=number], .row input:not([type]) { min-width: 0; background: #16181c; color: var(--text); border: 1px solid #3a3f49; border-radius: 4px; padding: 6px 8px; font: inherit; }
  input[type=search] { flex: 1; }
  #status { padding: 6px 12px; color: var(--dim); border-bottom: 1px solid var(--line); min-height: calc(2.8em + 12px); box-sizing: border-box; } /* two lines, so the list below doesn't jump when the message changes */
  #list { flex: 1; overflow: auto; }
  h3 { margin: 0; padding: 14px 12px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); border-bottom: 1px solid var(--line); }
  .crumbs { padding: 8px 12px; font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--line); }
  .crumbs .meta { font-weight: 400; }
  .crumbs .done { float: right; padding: 2px 10px; font-size: 12px; font-weight: 400; }
  .sub { padding: 8px 12px 4px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  .thing-btn { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px 12px; background: none; text-align: left; }
  .thing-btn.sel { color: var(--sel); background: rgba(77, 163, 255, .08); }
  .thing-btn { align-items: center; gap: 8px; }
  .thing-btn .name { flex: 1; }
  .thing-btn.hidden .name { color: var(--dim); text-decoration: line-through; }
  .thing-btn .eye { padding: 1px 8px; border: 1px solid #3a3f49; border-radius: 4px; font-size: 11px; color: var(--dim); }
  .thing-btn .eye:hover { border-color: var(--accent); color: var(--text); }
  .row.note { display: block; }
  .row.sides { grid-template-columns: 1fr repeat(4, auto); gap: 10px; }
  .row.sides label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .row.menuitem { grid-template-columns: 1fr repeat(3, 30px); gap: 4px; }
  .row.menuadd { grid-template-columns: 1fr 1fr auto; gap: 6px; }
  .row .reset { margin-left: 8px; padding: 0 6px; font-size: 11px; color: var(--dim); }
  .row.pick { grid-template-columns: 1fr minmax(0, 190px); }
  .row.pick .meta { grid-column: 2; }
  select { min-width: 0; background: #16181c; color: var(--text); border: 1px solid #3a3f49; border-radius: 4px; padding: 5px 6px; font: inherit; }
  details { border-bottom: 1px solid var(--line); }
  summary { padding: 9px 12px; cursor: pointer; font-weight: 600; }
  .fold summary { font-weight: 400; border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 40px 1fr 72px; gap: 10px; align-items: center; padding: 6px 12px; border-top: 1px solid var(--line); }
  .row.num { grid-template-columns: 1fr 112px 100px; }
  .step { display: flex; }
  .step input { width: 100%; text-align: center; border-radius: 0; -moz-appearance: textfield; }
  .step input::-webkit-inner-spin-button, .step input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .step button { flex: 0 0 26px; padding: 0; background: #22262d; color: var(--dim); border: 1px solid #3a3f49; font: inherit; font-size: 15px; line-height: 1; cursor: pointer; }
  .step button:hover { color: var(--text); background: #2b3038; border-color: var(--accent); }
  .step button:first-child { border-radius: 4px 0 0 4px; border-right: 0; }
  .step button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
  .row.check { grid-template-columns: 40px 1fr; cursor: pointer; }
  .row input[type=color] { width: 40px; height: 26px; padding: 0; border: 1px solid #3a3f49; border-radius: 4px; background: none; cursor: pointer; }
  .row input[type=range] { width: 72px; }
  .row input[type=checkbox] { justify-self: center; }
  .key { font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
  .meta { font-size: 11px; color: var(--dim); }
  .setting { display: block; font-family: ui-monospace, Consolas, monospace; font-size: 10px; opacity: .55; }
  #picker { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .6); z-index: 10; }
  #picker > div { width: min(520px, 92vw); max-height: 80vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  #picker h2 { margin: 0 0 4px; font-size: 16px; }
  #picker .hud { display: block; width: 100%; margin: 6px 0; text-align: left; }
  #newform { display: flex; gap: 8px; margin: 6px 0; }
  #newform[hidden] { display: none; }
  #newform input { flex: 1; min-width: 0; background: #16181c; color: var(--text); border: 1px solid #3a3f49; border-radius: 4px; padding: 6px 8px; font: inherit; }
  #picker .hud .meta { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 860px) { body { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
  /* sidebar: a header with the HUD and game tools, then cards of settings */
  :root { --card: #23262d; --head: #292d35; }
  aside { background: var(--bg); }
  .top { padding: 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .top .line { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .top .glabel { font-size: 11px; color: var(--dim); min-width: 62px; }
  .top .line button { padding: 5px 9px; }
  #texts button { padding: 3px 9px; border-radius: 12px; font-size: 12px; }
  .bar { padding: 8px 10px; border-bottom: 0; }
  #status { margin: 0 10px 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  #list { padding: 0 10px 16px; }
  #list h3 { border: 0; padding: 4px 2px 8px; }
  .card, #list > details { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px; overflow: hidden; }
  .card > .sub { padding: 8px 12px; background: var(--head); color: var(--text); font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; }
  .card > .sub + * { border-top: 1px solid var(--line); }
  .card .row { border-top-color: #2a2e35; }
  .card .thing-btn { border-bottom-color: #2a2e35; }
  .card .thing-btn:last-child { border-bottom: 0; }
  #list > details > summary { background: var(--head); }
  .crumbs { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; margin: 0 -10px 10px; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .crumbs .what { font-weight: 600; }
  .crumbs .meta { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumbs .done { float: none; margin-left: auto; padding: 4px 14px; font-size: 13px; }
  .crumbs .back { padding: 4px 10px; font-size: 12px; font-weight: 400; }
  select option:disabled { color: #666; }
</style>
</head>
<body>
<main id="preview">
  <div id="stage" class="schematic">
    <video id="video" autoplay muted playsinline hidden></video>
    <div id="empty"><p><b>Starting...</b></p></div>
    <div id="boxes"></div>
  </div>
</main>
<aside>
  <div class="top">
  <div class="line">
    <button id="hudbtn" title="Pick which HUD to edit">No HUD open</button>
    <button id="save" class="primary" disabled>Save HUD</button>
    <button id="undo" disabled title="Undo the last change (Ctrl+Z)">Undo</button>
    <button id="explore" title="Open the HUD's folder">Folder</button>
  </div>
  <div class="line">
    <span class="glabel">Game</span>
    <button id="testserver" title="Offline game with a frozen bot and bhop/surf-style timer texts on screen">Test server</button>
    <button id="scores" aria-pressed="false" title="Keep the scoreboard open to edit it. Click again (or press Tab in the game) to close it.">Scoreboard</button>
    <button id="capture" hidden>Capture game</button>
    <button id="launch" hidden>Launch game</button>
  </div>
  <div class="line" id="texts">
    <span class="glabel">Test text</span>
    <button data-bit="1" title="Timer box (font HudHintText) and right-side text (HudHintTextSmall)">Timer</button>
    <button data-bit="2" title="Centre print speed (font Trebuchet24, SourceScheme)">1 Speed</button>
    <button data-bit="4" title="jhud under it (font CenterPrintText, ClientScheme)">2 jhud</button>
    <button data-bit="8" title="Record times in the top left corner (font CenterPrintText, ClientScheme)">3 Top left</button>
    <button data-bit="16" title="A chat line every few seconds (font ChatFont, ChatScheme)">Chat</button>
  </div>
  </div>
  <div class="bar"><input type="search" id="search" placeholder="Search everything, e.g. health, timer, button"></div>
  <div id="status">Starting...</div>
  <div id="list"></div>
</aside>
<datalist id="fontfaces"></datalist>
<div id="picker" hidden><div>
  <h2>Which HUD do you want to edit?</h2>
  <p class="meta">Changes show in game straight away. They are kept when you click Done or Save HUD.</p>
  <div id="hudlist"></div>
  <button id="browse" class="hud">Browse for a HUD folder...<span class="meta">Any folder with resource/ or scripts/ inside</span></button>
  <button id="newhud" class="hud">Start a new HUD<span class="meta">From the default look, in your custom folder</span></button>
  <form id="newform" hidden><input id="newname" placeholder="Name it, e.g. Pink Surf" maxlength="60" aria-label="Name for the new HUD"><button class="primary">Create</button></form>
  <p id="newerr" class="meta"></p>
  <button id="pickclose" hidden>Cancel</button>
</div></div>
<script>
// The HUD is edited in place and the game shows it live (the exe puts back what wasn't saved); these are its files.
// The list shows them as one set of settings and sorts every edit into the right file.
const C = 'ClientScheme.res', S = 'SourceScheme.res', L = 'HudLayout.res', CH = 'ChatScheme.res';
const PATHS = { [C]: 'resource/ClientScheme.res', [S]: 'resource/SourceScheme.res', [L]: 'scripts/HudLayout.res', [CH]: 'resource/ChatScheme.res' };
// A HUD without one of these starts from a stub that #bases the game's file, [base file, root block]; both are
// written on the first change.
const STUBS = { [L]: ['hudlayout_default.res', 'Resource/HudLayout.res'], [CH]: ['chatscheme_default.res', 'Scheme'] };
const stubText = ([base, root]) => `#base "${base}"\n\n// Your changes go here. Anything not listed comes from ${base}.\n"${root}"\n{\n}\n`;

// ---------- what things are: HUD parts, windows, and the colours each VGUI control reads ----------
// Scheme colours: [label, keys ('|' = set together), note]. These three are shared by several HUD parts.
const NUMBERS = ['Numbers and icons', 'Panel.FgColor|OrangeDim', 'Shared with health, armor, ammo, money and the timer'];
const WARN = ['Warning flash', 'HudIcon_Red', 'Shared: getting hurt, spending money, low time, the bomb icon'];
const HIGHLIGHT = ['Highlight', 'HudIcon_Green', 'Shared: money gained and the buy zone, bomb and defuser icons'];

// HUD parts, keyed by panel name (= HudLayout block). layoutColours are colours set in that HudLayout block;
// hit = clickable area (HudLayout units) for panels much bigger than what they draw.
const HUD = {
  HudHealth: { name: 'Health', colours: [NUMBERS, WARN] },
  HudArmor: { name: 'Armor', colours: [NUMBERS] },
  HudAmmo: { name: 'Ammo', colours: [NUMBERS] },
  HudAccount: { name: 'Money', colours: [NUMBERS, HIGHLIGHT, WARN] },
  HudRoundTimer: { name: 'Round timer', colours: [NUMBERS, WARN] },
  HudRadar: { name: 'Radar' },
  HudLocation: { name: 'Location name' },
  overview: { name: 'Map overview' },
  HudShoppingCart: { name: 'Buy zone icon', colours: [HIGHLIGHT] },
  HudC4: { name: 'Bomb icon', colours: [HIGHLIGHT, WARN] },
  HudDefuser: { name: 'Defuse kit icon', colours: [HIGHLIGHT] },
  HudHostageRescueZone: { name: 'Rescue zone icon', colours: [HIGHLIGHT, WARN] },
  HudScenarioIcon: { name: 'Objective icon', colours: [['Icon', 'Hostage_Yellow', 'Bomb site / hostage icon by the timer']] },
  HudWeaponSelection: { name: 'Weapon selection', hit: ['r640', '16', '640', '100'], colours: [
    ['Weapon icons', 'FgColor', ''], ['Weapon names', 'SelectionTextFg', ''], ['Slot numbers', 'SelectionNumberFg', ''],
    ['Slot background', 'SelectionBoxBg|SelectionEmptyBoxBg', ''], ['Highlighted slot', 'SelectionSelectedBoxBg', ''] ],
    // its own colour settings take the scheme colour once, at startup; named in HudLayout they're looked up again on a reload
    // ("SelectedBoxClor" is spelt that way in the game)
    links: { NumberColor: 'SelectionNumberFg', BoxColor: 'SelectionBoxBg', EmptyBoxColor: 'SelectionEmptyBoxBg', SelectedBoxClor: 'SelectionSelectedBoxBg' }, rounded: true },
  HudDeathNotice: { name: 'Kill feed', hit: ['r260', '12', '248', '100'], layoutColours: [['CT names', 'CTTextColor', 'CT_Blue'], ['T names', 'TerroristTextColor', 'T_Red']] },
  // the chat reads ChatScheme; its message colours (names in team colours, yellow server lines) are the game's own
  HudChat: { name: 'Chat', scheme: CH, rounded: true, colours: [['Background', 'DullWhite', 'Behind the chat while typing; the game sets how see-through it is'],
    ['Typing text', 'Chat.TypingText', ''], ['"Say :" text', 'Label.TextColor', ''], ['Typing box', 'TextEntry.BgColor', '']] },
  HudHintDisplay: { name: 'Timer / hint text', fit: true, rounded: true, roundOnly: true, note: 'Font HudHintText', colours: [['Text', 'HintMessageFg', 'Also the right-side text'], ['Background', 'HintMessageBg', '']] },
  HudHintKeyDisplay: { name: 'Right-side text', fit: true, note: 'Font HudHintTextSmall', colours: [['Text', 'HintMessageFg', 'Shared with the timer text (the game ignores HudLayout "TextColor" here)']] },
  CCenterStringLabel: { name: 'Centre print text', fixed: 'The game always draws this text white, so no HUD can recolour it. Its font (below) can change.', note: 'PrintCenterText from server plugins; font Trebuchet24' },
  HudMessage: { name: 'Server HUD text (jhud, top left)', fixed: 'Its colour and position come from the server plugin, not the HUD. Its font (below) can change.', note: 'ShowHudText / game_text from server plugins and maps; font CenterPrintText',
    hit: [['c-60', '178', '120', '30'], ['4', '2', '230', '60']] },
  TargetID: { name: 'Player name when aiming', quiet: true, colours: [['Counter-Terrorists', 'CT_Blue', 'Also kill feed names unless set there'], ['Terrorists', 'T_Red', 'Also kill feed names unless set there'], ['Hostages', 'Hostage_Yellow', ''] ] },
  // radio menus, and SourceMod menus on bhop/surf servers (checkpoints, timer menus)
  // the game keeps its panel full width at x 0, so it only moves up and down
  HudMenu: { name: 'Radio and server menus', hit: ['0', 'c-100', '220', '200'], pos: true, lockX: true, colours: [
    ['Title', 'MenuColor', 'Also options that can\'t be picked'], ['Options', 'ItemColor', 'The numbered choices'], ['Background', 'MenuBoxBg', ''] ],
    links: { MenuColor: 'MenuColor', MenuItemColor: 'ItemColor', MenuBoxColor: 'MenuBoxBg' },
    fontKeys: [['Title font', 'TextFont', 'Default'], ['Options font', 'ItemFont|ItemFontPulsing', 'Default']] },
  HudProgressBar: { name: 'Plant / defuse bar', colours: [['Bar', 'ProgressBarFg', '']] },
  HudHistoryResource: { name: 'Pickup history', hit: ['r160', '250', '150', '130'], colours: [['Items', 'Yellowish', ''], ['Slot full', 'Caution', '']] },
  HudVoiceStatus: { name: 'Voice chat list', quiet: true },
  WinPanel_Round: { name: 'Round end panel' },
  HudAchievementTracker: { name: 'Achievement tracker', quiet: true },
};
// Fullscreen overlays that draw little; never picked by clicking (still reachable from the list).
const NO_CLICK = new Set(['hudweapon', 'hudcrosshair', 'hudzoom', 'hudclosecaption', 'targetid', 'hudflashbang', 'hudvoicestatus', 'hudachievementtracker', 'huddeathnotice', 'hudweaponselection', 'hudhistoryresource']);

// Windows: panel name -> friendly name, plus window-wide colours per scheme.
const WINDOWS = { info: 'Server message (MOTD)', team: 'Team select', class_ct: 'Class select', class_ter: 'Class select', buy: 'Buy menu',
  buy_ct: 'Buy menu', buy_ter: 'Buy menu', scores: 'Scoreboard', specgui: 'Spectator bars', specmenu: 'Spectator menu',
  gamemenu: 'Main menu', gameconsole: 'Console', optionsdialog: 'Options', cserverbrowserdialog: 'Server browser', serverbrowser: 'Server browser' };
const WINDOW_COLOURS = {
  [C]: [['Window background', 'Frame.BgColor', 'Also the spectator bars'], ['Backdrop', 'BgColor', 'Behind team select and the MOTD'], ['Title', 'FrameTitleBar.TextColor', ''],
    ['Text', 'Label.TextColor', 'Shared by in-game windows and the buy menu'], ['Borders', 'Border.Bright|Border.Dark', '']],
  [S]: [['Window background', 'Frame.BgColor', ''], ['Window background, not focused', 'Frame.OutOfFocusBgColor', ''],
    ['Title', 'FrameTitleBar.TextColor', ''], ['Title bar', 'FrameTitleBar.BgColor', ''], ['Text', 'Label.TextColor', ''], ['Borders', 'Border.Bright|Border.Dark', '']],
};
const EXTRA = {
  gamemenu: [['Menu text', 'MainMenu.TextColor', 'Resume Game, Find Servers, Options...'], ['Menu text (mouse over)', 'MainMenu.ArmedTextColor', ''],
    ['Menu text (clicked)', 'MainMenu.DepressedTextColor', ''], ['Background dim', 'MainMenu.Backdrop', 'Darkens the game behind the menu']],
  gameconsole: [['Console text', 'Console.TextColor', ''], ['Developer text', 'Console.DevTextColor', '']],
  team: [['Map description', 'MapDescriptionText', '']],
};

// Colours each VGUI control type reads (from vgui_controls' ApplySchemeSettings). First match on the class name wins.
const CONTROLS = [
  ['ComboBoxButton', 'Drop-down arrow', [['Arrow', 'ComboBoxButton.ArrowColor'], ['Arrow (mouse over)', 'ComboBoxButton.ArmedArrowColor'], ['Background', 'ComboBoxButton.BgColor']]],
  ['ScrollBarSlider', 'Scroll bar', [['Slider', 'ScrollBarSlider.FgColor'], ['Track', 'ScrollBarSlider.BgColor']]],
  ['ScrollBar', 'Scroll bar', [['Arrows', 'ScrollBarButton.FgColor'], ['Arrow buttons', 'ScrollBarButton.BgColor'], ['Slider', 'ScrollBarSlider.FgColor'], ['Track', 'ScrollBarSlider.BgColor']]],
  ['CheckButton', 'Checkbox', [['Text', 'CheckButton.TextColor'], ['Tick', 'CheckButton.Check'], ['Box', 'CheckButton.BgColor']]],
  ['RadioButton', 'Radio button', [['Text', 'RadioButton.TextColor'], ['Text (selected)', 'RadioButton.SelectedTextColor']]],
  ['MenuItem', 'Menu item', [['Text', 'Menu.TextColor'], ['Background', 'Menu.BgColor'], ['Text (mouse over)', 'Menu.ArmedTextColor'], ['Background (mouse over)', 'Menu.ArmedBgColor']]],
  ['Button', 'Button', [['Text', 'Button.TextColor'], ['Background', 'Button.BgColor'], ['Text (mouse over)', 'Button.ArmedTextColor'],
    ['Background (mouse over)', 'Button.ArmedBgColor'], ['Text (clicked)', 'Button.DepressedTextColor'], ['Background (clicked)', 'Button.DepressedBgColor']]],
  ['SectionedListPanel', 'Grouped list', [['Text', 'SectionedListPanel.TextColor'], ['Bright text', 'SectionedListPanel.BrightTextColor'], ['Headers', 'SectionedListPanel.HeaderTextColor'],
    ['Background', 'SectionedListPanel.BgColor'], ['Selected text', 'SectionedListPanel.SelectedTextColor'], ['Selected row', 'SectionedListPanel.SelectedBgColor']]],
  ['ListPanel', 'List', [['Text', 'ListPanel.TextColor'], ['Background', 'ListPanel.BgColor'], ['Selected text', 'ListPanel.SelectedTextColor'], ['Selected row', 'ListPanel.SelectedBgColor']]],
  ['RichText', 'Text box', [['Text', 'RichText.TextColor'], ['Background', 'RichText.BgColor'], ['Selected text', 'RichText.SelectedTextColor'], ['Selection', 'RichText.SelectedBgColor']]],
  ['TextEntry', 'Text field', [['Text', 'TextEntry.TextColor'], ['Background', 'TextEntry.BgColor'], ['Cursor', 'TextEntry.CursorColor'],
    ['Selected text', 'TextEntry.SelectedTextColor'], ['Selection', 'TextEntry.SelectedBgColor'], ['Read-only text', 'TextEntry.DisabledTextColor']]],
  ['PropertySheet', 'Tabs', [['Tab text', 'PropertySheet.TextColor'], ['Selected tab text', 'PropertySheet.SelectedTextColor']]],
  ['ProgressBar', 'Progress bar', [['Bar', 'ProgressBar.FgColor'], ['Background', 'ProgressBar.BgColor']]],
  ['Slider', 'Slider', [['Knob', 'Slider.NobColor'], ['Text', 'Slider.TextColor'], ['Track', 'Slider.TrackColor']]],
  ['Menu', 'Menu', [['Text', 'Menu.TextColor'], ['Background', 'Menu.BgColor'], ['Text (mouse over)', 'Menu.ArmedTextColor'], ['Background (mouse over)', 'Menu.ArmedBgColor']]],
  ['Label', 'Text', [['Text', 'Label.TextColor'], ['Dim text', 'Label.TextDullColor'], ['Bright text', 'Label.TextBrightColor'], ['Background', 'Label.BgColor']]],
];
// Game subclasses of the VGUI controls. The buy menu's buttons draw their text with Label.TextColor (checked in telehud).
// PageTab: one tab of a PropertySheet, drawn with its colours; CCheckBoxWithStatus: the server browser's checkbox

// ---------- KeyValues parsing: just enough for .res files, keeping text offsets so edits touch one line ----------
function evalCond(c) {
  const expr = c.slice(1, -1).replace(/\$(WIN32|WINDOWS)\b/g, '1').replace(/\$\w+/g, '0');
  return /^[01!&|() ]*$/.test(expr) ? !!Function('return ' + expr)() : true;
}

function tokenize(text) {
  const out = [];
  let i = 0;
  while (i < text.length) {
    const c = text[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === '/' && text[i + 1] === '/') { const j = text.indexOf('\n', i); i = j < 0 ? text.length : j; continue; }
    if (c === '{' || c === '}') { out.push({ t: c, start: i }); i++; continue; }
    if (c === '[') { const j = text.indexOf(']', i); if (j < 0) break; out.push({ t: 'cond', s: text.slice(i, j + 1) }); i = j + 1; continue; }
    if (c === '"') { const j = text.indexOf('"', i + 1); if (j < 0) break; out.push({ t: 'str', s: text.slice(i + 1, j), start: i + 1, end: j, q: true }); i = j + 1; continue; }
    let j = i;
    while (j < text.length && !/[\s{}"]/.test(text[j])) j++;
    out.push({ t: 'str', s: text.slice(i, j), start: i, end: j, q: false });
    i = j;
  }
  return out;
}

function parse(text) {
  const tk = tokenize(text), entries = [], sections = [], bases = [];
  let k = 0;
  function block(path) {
    while (k < tk.length) {
      const a = tk[k];
      if (a.t === '}') return a.start;
      if (a.t !== 'str') { k++; continue; }
      if (a.s === '#base' || a.s === '#include') { if (tk[k + 1]) bases.push(tk[k + 1].s); k += 2; continue; }
      let b = tk[k + 1], cond = null;
      if (b && b.t === 'cond' && tk[k + 2] && tk[k + 2].t === '{') cond = b.s, b = tk[++k + 1]; // "1" [$WIN32] { ... }
      k += 2;
      if (b && b.t === '{') {
        const e0 = entries.length, s0 = sections.length;
        const close = block([...path, a.s]);
        sections.push({ path: [...path, a.s], close, kstart: a.q ? a.start - 1 : a.start });
        if (cond && !evalCond(cond)) entries.length = e0, sections.length = s0; // a block for another platform
        k++;
      } else if (b && b.t === 'str') {
        let ok = true;
        if (tk[k] && tk[k].t === 'cond') ok = evalCond(tk[k++].s);
        if (ok) entries.push({ path, key: a.s, value: b.s, start: b.start, end: b.end, q: b.q, kstart: a.q ? a.start - 1 : a.start });
      }
    }
    return text.length;
  }
  block([]);
  return { entries, sections, bases };
}

// ---------- model ----------
const isColor = v => /^\s*-?\d+\s+-?\d+\s+-?\d+(\s+-?\d+)?\s*$/.test(v || '');
const sectionOf = e => (e.path[1] || '').toLowerCase();

// Scheme Colors and BaseSettings merged over the #base files, keyed lowercase (KeyValues is case-insensitive).
function tables(f) {
  const colors = new Map(), base = new Map();
  for (const p of [...f.bases, f.parsed]) {
    for (const e of p.entries) {
      const t = sectionOf(e) === 'colors' ? colors : sectionOf(e) === 'basesettings' ? base : null;
      if (t) t.set(e.key.toLowerCase(), { name: e.key, value: e.value });
    }
  }
  return { colors, base };
}
const EMPTY_TABLES = { colors: new Map(), base: new Map() };

// Same lookup order as the game: literal colour, then Colors (not followed further), then BaseSettings.
function resolve(t, v, depth = 0) {
  if (isColor(v)) return v;
  if (depth > 16 || !v) return null;
  const c = t.colors.get(v.toLowerCase());
  if (c) return isColor(c.value) ? c.value : null;
  const b = t.base.get(v.toLowerCase());
  return b ? resolve(t, b.value, depth + 1) : null;
}

// One HudLayout block's settings (own file over #base), keyed lowercase.
function layoutProps(f, id) {
  const props = {};
  if (f) for (const p of [...f.bases, f.parsed]) for (const e of p.entries)
    if (e.path.length === 2 && e.path[1].toLowerCase() === id.toLowerCase()) props[e.key.toLowerCase()] = e.value;
  return props;
}

// HudLayout position/size to screen pixels. Values are in 640x480 units scaled by screen height;
// "r" = from the right/bottom, "c" = from the centre, "f" (sizes) = full minus.
function coord(v, full, scale, isPos) {
  const m = /^\s*([rcf]?)\s*(-?[\d.]+)\s*$/i.exec(v || '0');
  if (!m) return 0;
  const n = +m[2] * scale, p = m[1].toLowerCase();
  if (isPos) return p === 'r' ? full - n : p === 'c' ? full / 2 + n : n;
  return p === 'f' ? full - n : n;
}
function rectOf(props, W, H, hit) {
  if (hit && Array.isArray(hit[0])) hit = hit[0]; // several click areas: the first (see clickRects)
  const s = H / 480, [x, y, w, h] = hit || [props.xpos, props.ypos, props.wide, props.tall];
  return { x: coord(x, W, s, true), y: coord(y, H, s, true), w: coord(w, W, s), h: coord(h, H, s) };
}

const toRgba = v => { const n = v.trim().split(/\s+/).map(Number); return [n[0], n[1], n[2], n.length > 3 ? n[3] : 255]; };
const toHex = ([r, g, b]) => '#' + [r, g, b].map(x => Math.max(0, Math.min(255, x)).toString(16).padStart(2, '0')).join('');
const fromHex = (hex, a) => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).concat(a).join(' ');

// Returns f.text with `key` set inside the top-level block `section` (BaseSettings, or HudHealth in HudLayout):
// edited in place if this file has it, otherwise added to that block, which is created if needed.
const setIn = (f, section, key, value) => setAt(f, [section], key, value);

// Same, for any depth below the top-level block: sub = ['Fonts', 'HudNumbers', '1'] sets a font entry's key.
// Missing blocks are created (with #base, a block holding one key still merges with the base's full block).
function setAt(f, sub, key, value) {
  const same = (a, b) => a.length === b.length && a.every((x, i) => x.toLowerCase() === b[i].toLowerCase());
  const text = f.text, k = key.toLowerCase();
  const e = f.parsed.entries.find(e => same(e.path.slice(1), sub) && e.key.toLowerCase() === k);
  if (e) return text.slice(0, e.start) + (e.q ? value : `"${value}"`) + text.slice(e.end);
  for (let n = sub.length; n >= 0; n--) {
    const s = f.parsed.sections.find(s => s.path.length === n + 1 && same(s.path.slice(1), sub.slice(0, n)));
    if (!s) continue;
    // s.close is its "}", already indented n tabs: new lines go in front of it at depth n + 1
    const tab = d => '\t'.repeat(d), name = x => /^[A-Za-z_][\w.]*$/.test(x) ? x : `"${x}"`;
    let ins = '', d = n + 1;
    for (const block of sub.slice(n)) { ins += `${tab(d)}${name(block)}\n${tab(d)}{\n`; d++; }
    ins += `${tab(d)}"${key}"\t\t"${value}"\n`;
    while (d > n + 1) ins += `${tab(--d)}}\n`;
    return text.slice(0, s.close) + ins.slice(n) + tab(n) + text.slice(s.close);
  }
  throw new Error(`${f.name} has no top-level { } block`);
}

const samePath = (a, b) => a.length === b.length && a.every((x, i) => x.toLowerCase() === b[i].toLowerCase());

// Replaces the whole block `name` under sub in f's own file (or a one-line `name "other"` there), else adds it.
// body: [key, value] pairs; a value that is itself a list of pairs is a nested block.
function setBlock(f, sub, name, body) {
  const text = f.text, tab = d => '\t'.repeat(d), q = x => /^[A-Za-z_][\w.]*$/.test(x) ? x : `"${x}"`;
  const write = (pairs, d) => pairs.map(([k, v]) => Array.isArray(v)
    ? `${tab(d)}${q(k)}\n${tab(d)}{\n${write(v, d + 1)}${tab(d)}}\n` : `${tab(d)}"${k}"\t"${v}"\n`).join('');
  const lineStart = i => text.lastIndexOf('\n', i - 1) + 1, lineEnd = i => { const n = text.indexOf('\n', i); return n < 0 ? text.length : n + 1; };
  const blk = f.parsed.sections.find(s => samePath(s.path.slice(1), [...sub, name]));
  const alias = !blk && f.parsed.entries.find(e => samePath(e.path.slice(1), sub) && e.key.toLowerCase() === name.toLowerCase());
  const at = blk ? [blk.kstart, blk.close] : alias ? [alias.kstart, alias.end] : null;
  if (at) return text.slice(0, lineStart(at[0])) + write([[name, body]], sub.length + 1) + text.slice(lineEnd(at[1]));
  for (let n = sub.length; n >= 0; n--) {
    const s = f.parsed.sections.find(s => s.path.length === n + 1 && samePath(s.path.slice(1), sub.slice(0, n)));
    if (!s) continue;
    let pairs = [[name, body]];
    for (let i = sub.length - 1; i >= n; i--) pairs = [[sub[i], pairs]];
    return text.slice(0, s.close) + write(pairs, n + 1).slice(n) + tab(n) + text.slice(s.close);
  }
  throw new Error(`${f.name} has no top-level { } block`);
}

// Takes key out of sub in f's own file: the whole line when nothing else is on it.
function dropKey(f, sub, key) {
  const text = f.text, e = f.parsed.entries.find(e => samePath(e.path.slice(1), sub) && e.key.toLowerCase() === key.toLowerCase());

// A font's entries ("1", "2"... each for a range of screen heights), own file over #base, keys lowercase.
function fontVariants(f, font) {
  const vars = new Map();
  for (const p of [...f.bases, f.parsed]) for (const e of p.entries) {
    if (e.path.length !== 4 || e.path[1].toLowerCase() !== 'fonts' || e.path[2].toLowerCase() !== font.toLowerCase()) continue;
    if (!vars.has(e.path[3])) vars.set(e.path[3], {});

// The entry the game uses at this screen height: the first whose yres range contains it, else the first without one.
function activeVariant(vars, H) {

    const [a, b] = (p.yres || '').split(/\s+/).map(Number);
    if (p.yres && H >= a && H <= b) return k;

// A scheme colour goes where the game reads it from: Colors if it is defined there, else BaseSettings.
const withValue = (f, key, value) => setIn(f, tables(f).colors.has(key.toLowerCase()) ? 'Colors' : 'BaseSettings', key, value);

// ---------- exe bridge: sends "id\nop\narg\nbody", the exe answers "id\n1\nresult" or "id\n0\nerror"; "!event" = from the exe ----------
const host = window.chrome && window.chrome.webview;
const pending = {};
let seq = 0;
if (host) host.addEventListener('message', e => {
  const s = e.data;
  if (s[0] === '!') return onHostEvent(s.slice(1));
  const a = s.indexOf('\n'), id = s.slice(0, a), p = pending[id];
  delete pending[id];

// ---------- files ----------
let hudName = null, files = [], writing = Promise.resolve(), dirty = false;

const F = name => files.find(f => f.name === name);
let statusAt = 0;
const status = msg => { $('status').textContent = msg; statusAt = Date.now(); };
const readHud = path => call('read', path).catch(() => null);

async function loadFile(name) {

// ---------- undo: each step is a file's text from before a change ----------
const undoSteps = [];
// Values HudLayout no longer sets stay in a running game, so they are first put back to what the game falls back to.
const LAYOUT_FALLBACK = { alpha: '255', roundedcorners: '15', texture1: 'vgui/hud/8x800corner1', texture2: 'vgui/hud/8x800corner2',
  texture3: 'vgui/hud/8x800corner3', texture4: 'vgui/hud/8x800corner4' };

async function undo() {
  const step = undoSteps.pop();
  $('undo').disabled = !undoSteps.length;
  if (!step) return status('Nothing to undo.');
  await writing;
  const { f, text } = step, before = parse(text);
  writing = writing.then(async () => {
    try {
      if (f.name === L) {
        let reset = { ...f, text, parsed: before };
        for (const e of f.parsed.entries) {
          if (e.path.length !== 2 || before.entries.some(b => samePath(b.path, e.path) && b.key.toLowerCase() === e.key.toLowerCase())) continue;
          const v = layoutProps({ bases: f.bases, parsed: { entries: [] } }, e.path[1])[e.key.toLowerCase()] ?? LAYOUT_FALLBACK[e.key.toLowerCase()];
          if (v !== undefined) reset = { ...reset, text: setAt(reset, [e.path[1]], e.key, v) }, reset.parsed = parse(reset.text);
        }
        if (reset.text !== text) { await call('write', f.path, reset.text); await sleep(1200); } // let the game take it
      }
      await call('write', f.path, text);
      Object.assign(f, { text, parsed: before });
      setDirty(true);
      status('Undone.');
    } catch (err) {
      status(`Couldn't undo: ${err.message}`);
    }
  });
  await writing;
  render();
  drawBoxes();
}

function setDirty(d) {
  dirty = d;
  $('save').disabled = !d;
  $('save').textContent = d ? 'Save HUD *' : 'Save HUD';
}

// Every edit goes through here. section = HudLayout block for layout settings; scheme colours are sorted into Colors/BaseSettings.
const timers = {};
function save(f, key, value, section = null) {
  const id = `${f.name}/${section}/${key}`;
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => {
    const sub = Array.isArray(section) ? section : section ? [section] : null;
    // a function value is worked out when it's written, from the file as it is then (blocks built from what's there)
    commit(f, id, () => {
      const v = typeof value === 'function' ? value() : value;
      return Array.isArray(v) ? setBlock(f, sub, key, v) : v === null ? dropKey(f, sub, key) : sub ? setAt(f, sub, key, v) : withValue(f, key, v);
    });
  }, 250);
}

// A reload re-applies the chat's settings, which takes it out of typing. If it was open when an edit started, press
// the player's chat key once it closes (the game opens it only from a real key press; the editor comes back after).
let chatKey = null, chatWatch = null;
function keepChatOpen() {
  const open = () => live && live.panels.some(p => p.key === 'hudchat' && p.keys); // typing: the chat takes keys
  if (chatWatch || !open()) return;
  let tries = 0;
  chatWatch = setInterval(async () => {
    if (open() && ++tries < 12) return; // wait up to 6 s for the reload
    clearInterval(chatWatch);
    if (!open()) {
      if (chatKey === null) {
        const m = /^\s*bind\s+"([^"]+)"\s+"messagemode"\s*$/mi.exec(await call('config').catch(() => ''));
        const k = m ? m[1].toUpperCase() : 'Y';
        chatKey = SCAN[/^[A-Z]$/.test(k) ? `Key${k}` : /^\d$/.test(k) ? `Digit${k}` : 'KeyY'];
      }
      await call('key', chatKey).catch(() => {});
    }
    chatWatch = null;
  }, 500);
}

// Writes a file's new text (made by edit() from its current text) as one undo step, once earlier writes are done.
function commit(f, id, edit) {
  keepChatOpen();
  writing = writing.then(async () => {
    try {
      const next = edit();
      if (f.defaultText) {
        await call('write', f.path.replace(/[^/]+$/, STUBS[f.name][0]), f.defaultText);
        f.defaultText = null;
      }
      // one undo step per setting; a slider dragged or a number typed within 1.5 s is still that step
      const last = undoSteps[undoSteps.length - 1], now = Date.now();
      if (!last || last.id !== id || now - last.at > 1500) undoSteps.push({ f, id, text: f.text });
      if (undoSteps.length > 200) undoSteps.shift();
      undoSteps[undoSteps.length - 1].at = now;
      $('undo').disabled = false;
      await call('write', f.path, next);
      Object.assign(f, { text: next, parsed: parse(next) });
      setDirty(true);
      status('Changed in game. Click Done or Save HUD to keep it.');
      drawBoxes();
    } catch (err) {
      status(`Couldn't apply: ${err.message}`);
    }
  });
}

// ---------- what's on screen: the plugin lists visible game panels (tree order, with depth and class) ----------
let live = null, liveRaw = null;
const CONTAINERS = new Set(['staticpanel', 'staticclientdllpanel', 'counterstrike root panel', 'cbaseviewport', 'gameui panel', 'basegameuipanel',
  'staticclientdlltoolspanel', 'engine tools', 'focusoverlaypanel', 'cconpanel']);

function parsePanels(raw) {
  const [head, ...lines] = raw.trim().split('\n');
  const [, W, H] = head.split('\t');
  const stack = [], panels = [];
  for (const l of lines) {
    const [d, module, name, x, y, w, h, cls, scheme, keys] = l.split('\t');
    const p = { depth: +d, module, name: name || '', key: (name || '').toLowerCase(), x: +x, y: +y, w: +w, h: +h, cls: cls || '', scheme, keys: keys === 'k' };
    stack.length = p.depth - 1;
    p.parent = stack[p.depth - 2] || null;
    stack[p.depth - 1] = p;
    p.frame = false;
    if (p.key === 'frame_caption' && p.parent) p.parent.frame = true; // a window (Frame) has a title bar child
    panels.push(p);
  }
  for (const p of panels) p.thing = thingOf(p);
  return { W: +W, H: +H, panels };
}

// The HUD part or window a panel belongs to: the nearest ancestor-or-self sitting directly in a container.
function thingOf(p) {
  for (let q = p; q; q = q.parent) {
    if (CONTAINERS.has(q.key)) return null;
    if (!q.parent || CONTAINERS.has(q.parent.key) || q.frame) return q;
  }
  return null;
}

function thingInfo(t) {
  const hud = HUD[t.name] || Object.entries(HUD).find(([k]) => k.toLowerCase() === t.key)?.[1];
  if (hud) return { kind: 'hud', id: t.name, name: hud.name, hud };

// A HUD without the file starts from the game's own copy (written into the HUD on the first change).
async function uiFile(path) {

// ---------- hiding window parts ----------
// Windows set their parts' visibility themselves (the spectator bars show their labels whatever "visible" says),
// so a part is hidden by moving it off screen, its position kept in "xpos_hudeditor" as for HUD parts. The
// spectator bars are sized by the game from the file instead: the top bar keeps its height (0 hides it) and the
// bottom bar reaches from its y position to the bottom of the screen (r0 hides it).
const WINDOW_PARTS = { specgui: [['Top bar', 'topbar', 'tall', '0'], ['Bottom bar', 'bottombarblank', 'ypos', 'r0']] };
const hideHow = block => {
  const part = Object.values(WINDOW_PARTS).flat().find(([, b]) => b === block);
  return part ? part.slice(2) : ['xpos', '9999'];
};
const partHidden = (f, block) => `${hideHow(block)[0]}_hudeditor` in layoutProps(f, block);
function setPartHidden(f, block, hide) {
  const [key, off] = hideHow(block), p = layoutProps(f, block);
  if (hide === partHidden(f, block)) return;
  if (hide) { save(f, `${key}_hudeditor`, p[key] || '0', block); save(f, key, off, block); }
  else { save(f, key, p[`${key}_hudeditor`], block); save(f, `${key}_hudeditor`, null, block); }
}
const showRow = (f, block, label) => checkRow(label, !partHidden(f, block), on => { setPartHidden(f, block, !on); refreshSoon(); });
// The window's own bars, plus every part hidden here (they can't be clicked in the preview any more).
function windowPartRows(sel) {
  const f = sel.res, parts = (WINDOW_PARTS[sel.info.id] || []).map(([label, block]) => [label.toLowerCase(), block]);
  if (!f) return [];
  for (const s of f.parsed.sections)
    if (s.path.length === 2 && !parts.some(([, b]) => b === s.path[1]) && partHidden(f, s.path[1])) parts.push([prettify(s.path[1]), s.path[1]]);
  return parts.map(([label, block]) => showRow(f, block, `Show ${label}`));
}

async function select(sel) {
  // loaded before it becomes the selection: the panel poll copies the selection, and a copy made while this waited
  // would never get the file
  if (sel) sel.res = await uiFile(UI_RES[sel.thing.key]);
  if (sel && sel.thing.key === 'scores') await Promise.all([loadCvars(), loadSbSelect()]);
  selected = sel;
  render();
  drawBoxes();

}

// Where a HUD part can be clicked: its panel, or its "hit" areas (one, or a list) when the panel is bigger than what it
// draws, or ("fit") the area its child panels cover: the hint box is a label sized to the text in a much larger panel.
function clickRects(p, info, W, H) {
  if (p !== p.thing || !info.hud) return [p];
  if (info.hud.hit) {
    // a full-screen panel draws at a fixed place inside itself, so its areas move with the panel (xpos/ypos)
    const ox = p.w >= W * 0.95 ? p.x : 0, oy = p.h >= H * 0.95 ? p.y : 0;
    return (Array.isArray(info.hud.hit[0]) ? info.hud.hit : [info.hud.hit]).map(h => { const r = rectOf({}, W, H, h); return { ...r, x: r.x + ox, y: r.y + oy }; });
  }
  const kids = info.hud.fit && live ? live.panels.filter(q => q.parent === p && q.w * q.h > 0) : [];
  if (!kids.length) return [p];
  const x = Math.min(...kids.map(q => q.x)), y = Math.min(...kids.map(q => q.y));
  return [{ x, y, w: Math.max(...kids.map(q => q.x + q.w)) - x, h: Math.max(...kids.map(q => q.y + q.h)) - y }];
}

// Click in the preview: the smallest panel under the mouse, skipping containers and fullscreen overlays.
function pickAt(fx, fy) {
  if (!live) {
    const b = boxList().boxes.filter(b => fx >= b.r.x / boxList().W && fx <= (b.r.x + b.r.w) / boxList().W && fy >= b.r.y / boxList().H && fy <= (b.r.y + b.r.h) / boxList().H)
      .sort((a, b) => a.r.w * a.r.h - b.r.w * b.r.h)[0];
    return b ? { thing: b.thing, info: b.info, control: null } : null;
  }
  const x = fx * live.W, y = fy * live.H;
  let best = null;
  for (const p of live.panels) {
    if (!p.thing || p.w * p.h <= 0 || CONTAINERS.has(p.key) || p.key.startsWith('frame_') && p.key.endsWith('grip')) continue;
    const info = thingInfo(p.thing);
    if (!info || (p === p.thing && NO_CLICK.has(p.key))) continue;
    const r = clickRects(p, info, live.W, live.H).find(r => x >= r.x && y >= r.y && x <= r.x + r.w && y <= r.y + r.h);
    if (!r) continue;
    const area = r.w * r.h, layer = p.module === 'ClientDLL' ? 0 : 1; // menus and the console draw above the HUD
    if (area > 0.9 * live.W * live.H && p !== p.thing) continue;
    if (!best || layer > best.layer || (layer === best.layer && area < best.area)) best = { p, info, area, layer, r };
  }
  if (!best) return null;
  // the control is the nearest panel (clicked one or a parent) that is a known control type; not inside HUD parts (but
  // the chat: its filter button, scroll bar and history) or the main menu
  let c = best.p;
  while (c && c !== best.p.thing && !controlOf(c.cls)) c = c.parent;
  const control = (best.info.kind === 'window' && best.info.id !== 'gamemenu' || best.info.id === 'HudChat') && c && c !== best.p.thing ? c : null;
  return { thing: best.p.thing, info: best.info, control, node: best.p !== best.p.thing ? best.p : null, r: best.r };
}

// ---------- list ----------
function colorRow(label, note, value, onChange, keys = [], onReset = null) {
  const rgba = toRgba(value);
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<input type="color" value="${toHex(rgba)}"><div><div></div><div class="meta"></div></div>
    <input type="range" min="0" max="255" value="${rgba[3]}" title="Opacity">`;
  const [color, alpha] = row.querySelectorAll('input');
  color.setAttribute('aria-label', `${label} colour`);
  alpha.setAttribute('aria-label', `${label} opacity`);
  row.children[1].firstElementChild.textContent = label;
  row.querySelector('.meta').textContent = note;
  if (keys.length) row.querySelector('.meta').append(el('span', { className: 'setting', textContent: keys.join(' + ') }));
  if (onReset) row.children[1].firstElementChild.append(el('button', { className: 'reset', textContent: 'Default', title: 'Back to the default colour', onclick: onReset }));
  color.oninput = alpha.oninput = () => onChange(fromHex(color.value, +alpha.value));
  row.dataset.q = `${label} ${note} ${keys.join(' ')}`.toLowerCase();
  return row;
}

const ANCHOR = { xpos: { '': 'from the left', r: 'from the right', c: 'from the centre' }, ypos: { '': 'from the top', r: 'from the bottom', c: 'from the centre' },
  wide: { '': '', f: 'less than full width' }, tall: { '': '', f: 'less than full height' } };

function numRow(lay, id, key, label, raw) {
  const m = /^\s*([rcf]?)\s*(-?[\d.]+)\s*$/i.exec(raw || '0') || [0, '', '0'];
  const prefix = m[1].toLowerCase();
  const row = inputRow(label, m[2], v => save(lay, key, prefix + v, id), { type: 'number', step: 1 });
  row.lastElementChild.textContent = ANCHOR[key][prefix] || '';
  row.dataset.q = `${label} position size`.toLowerCase();
  return row;
}

function selectRow(label, options, value, onChange, keys = []) {
  const row = el('div', { className: 'row pick' }), sel = el('select');
  for (const [v, text, off] of options) sel.append(el('option', { value: v, textContent: text, disabled: !!off }));
  sel.value = value;
  sel.setAttribute('aria-label', label);
  sel.onchange = () => onChange(sel.value);
  row.append(el('div', { textContent: label }), sel, el('div', { className: 'meta' }));
  if (keys.length) row.lastElementChild.append(el('span', { className: 'setting', textContent: keys.join(' + ') }));
  row.dataset.q = `${label} ${keys.join(' ')}`.toLowerCase();
  return row;
}

// 0-255 as a percentage slider.
function rangeRow(label, value, onChange) {
  const row = el('div', { className: 'row num' }), input = el('input', { type: 'range', min: 0, max: 255, value: +value || 0 });
  const pct = el('div', { className: 'meta', textContent: `${Math.round(input.value / 2.55)}%` });
  input.setAttribute('aria-label', label);
  input.oninput = () => { pct.textContent = `${Math.round(input.value / 2.55)}%`; onChange(input.value); };
  row.append(el('div', { textContent: label }), input, pct);
  row.dataset.q = label.toLowerCase();
  return row;
}

function noteRow(text) {
  const row = el('div', { className: 'row note meta', textContent: text });
  row.dataset.q = '';
  return row;
}

function checkRow(label, checked, onChange) {
  const row = document.createElement('label');
  row.className = 'row check';
  row.innerHTML = `<input type="checkbox"${checked ? ' checked' : ''}><div></div>`;
  row.lastElementChild.textContent = label;
  row.firstElementChild.onchange = e => onChange(e.target.checked);
  row.dataset.q = label.toLowerCase();
  return row;
}

function schemeRows(file, list, after = null) {
  const f = F(file);
  if (!f) return [];
  const t = tables(f);
  return list.map(([label, keys, note = '']) => {
    const ks = keys.split('|'), value = resolve(t, ks[0]);
    // values the HUD sets itself can go back to the default one from its #base file
    const own = f.parsed.entries.filter(e => e.path.length === 2 && /^(colors|basesettings)$/i.test(e.path[1]) && ks.some(k => k.toLowerCase() === e.key.toLowerCase()));
    const reset = own.length && f.bases.length ? () => { own.forEach(e => save(f, e.key, null, [e.path[1]])); refreshSoon(); } : null;
    return value && colorRow(label, note || DESCRIBE[ks[0].toLowerCase()] || '', value, v => { ks.forEach(k => save(f, k, v)); if (after) after(ks); }, ks, reset);
  }).filter(Boolean);
}

// Rows for a HUD part: its colours, HudLayout colours, box and position/size.
function hudRows(id, hud) {
  // colours the part's own settings only take from the scheme at startup: name them in HudLayout so a reload looks again
  const link = ks => {
    const lay = F(L), p = lay ? layoutProps(lay, id) : {};
    for (const [v, k] of Object.entries(hud.links || {})) if (ks.includes(k) && (p[v.toLowerCase()] || '').toLowerCase() !== k.toLowerCase()) save(lay, v, k, id);
  };
  const rows = [...(hud.fixed ? [noteRow(hud.fixed)] : []), ...schemeRows(hud.scheme || C, hud.colours || [], hud.links ? link : null)];
  const lay = F(L), cs = F(C), t = cs ? tables(cs) : EMPTY_TABLES;
  if (!lay) return rows;
  const p = layoutProps(lay, id);
  for (const [label, key, fallback] of hud.layoutColours || []) {
    const v = resolve(t, p[key.toLowerCase()] || fallback);
    if (v) rows.push(colorRow(label, ` for this part only`, v, v2 => save(lay, key, v2, id), [key]));
  }
  if (canHide(id)) rows.unshift(...visibilityRows(id));
  // hud.rounded: the game draws the box itself (the chat, the timer, weapon selection); its colour is listed above
  if ('paintbackgroundtype' in p || hud.rounded) rows.push(...boxRows(lay, id, p, t, hud));

  for (const [label, keys, dflt] of hud.fontKeys || []) {

// ---------- hiding HUD parts ----------
// "alpha" fades a part and everything in it (0 hides it). The game animates the alpha of these itself
// (hudanimations.txt), so they are hidden by moving them off screen instead, keeping their position in
// "xpos_hudeditor" (a key the game ignores). Values stay in a running game until set again, so showing a part
// writes alpha 255 rather than removing the key.
const SELF_FADING = new Set(['HudHintDisplay', 'HudHintKeyDisplay', 'HudWeaponSelection', 'HudMenu', 'HudHistoryResource']);
const isHidden = id => { const p = layoutProps(F(L), id); return SELF_FADING.has(id) ? 'xpos_hudeditor' in p : p.alpha !== undefined && +p.alpha === 0; };

const canHide = id => !!F(L) && Object.keys(layoutProps(F(L), id)).length > 0;

function setHidden(id, hide) {
  const lay = F(L), p = layoutProps(lay, id);
  if (!SELF_FADING.has(id)) return save(lay, 'alpha', hide ? '0' : '255', id);
  if (hide === 'xpos_hudeditor' in p) return;
  if (hide) { save(lay, 'xpos_hudeditor', p.xpos || '0', id); save(lay, 'xpos', '9999', id); }
  else { save(lay, 'xpos', p.xpos_hudeditor, id); save(lay, 'xpos_hudeditor', null, id); }
}

// After a change that alters which rows or tags show: redraw once it's written.
const refreshSoon = async () => { await sleep(400); await writing; render(); drawBoxes(); };

function visibilityRows(id) {
  const lay = F(L), p = layoutProps(lay, id), rows = [checkRow('Show on screen', !isHidden(id), on => { setHidden(id, !on); refreshSoon(); })];
  if (SELF_FADING.has(id)) rows.push(noteRow('The game fades this one in and out itself, so it can only be shown or hidden.'));
  else rows.push(rangeRow('Opacity', p.alpha ?? '255', v => save(lay, 'alpha', v, id)));
  return rows;
}

// ---------- box corners ----------
// PaintBackgroundType 0 draws a square box, 2 a rounded one; its corners are the images Texture1-4 (by default
// vgui/hud/8x800corner1-4). Boxes the game's own code draws (hud.rounded) are always "rounded", so they go square
// with plain square corner images instead. The timer's box (hud.roundOnly) is drawn by a part HudLayout can't reach.
const ROUND_CORNERS = 'vgui/hud/8x800corner';
const squareTex = p => /square_corner1$/i.test(p.texture1 || '');
async function setCorners(lay, id, square, drawn) {
  try {
    const base = square ? await call('corners', 'square') : ROUND_CORNERS;
    // written even to put the defaults back: values HudLayout no longer sets stay in a running game
    for (let i = 1; i <= 4; i++) save(lay, `Texture${i}`, base + i, id);
    if (!drawn) { save(lay, 'PaintBackgroundType', square ? '0' : '2', id); if (!square) save(lay, 'RoundedCorners', '15', id); }
    // a panel with a "border" takes its box shape from the border, and a running game keeps a border once set
    if (!drawn && layoutProps(lay, id).border !== undefined) {
      save(lay, 'border', null, id);
      save(lay, 'paintborder', null, id);
      alert('Restart the game to see the new corners.\n\nThis part had a border, which sets its box shape. The border is taken out, but the game only lets go of it when it restarts.');
    }
  } catch (err) { status(err.message); }

// An earlier editor made every default-rounded box square by replacing the game's corner material in the HUD.
const CORNER_VMT = n => `materials/vgui/hud/8x800corner${n}.vmt`;
let squareAll = false;
function removeSquareAll() {
  squareAll = false;
  writing = writing.then(async () => {
    try {
      for (let n = 1; n <= 4; n++) await call('write', CORNER_VMT(n), `"UnlitGeneric"\n{\n\t"$basetexture" "vgui/hud/8x800corner${n}"\n`
        + '\t"$translucent" "1"\n\t"$vertexcolor" "1"\n\t"$vertexalpha" "1"\n\t"$ignorez" "1"\n\t"$no_fullbright" "1"\n}\n');
      await call('cmd', '', 'mat_reloadmaterial 8x800corner');
      setDirty(true);
      status('Changed in game. Click Done or Save HUD to keep it.');
    } catch (err) { status(`Couldn't apply: ${err.message}`); }
    render();
  });
}

function boxRows(lay, id, p, t, hud) {
  const rows = [];
  if (!hud.rounded) {
    const bg = (p.bgcolor_override && resolve(t, p.bgcolor_override)) || resolve(t, 'Panel.BgColor') || '0 0 0 0';
    rows.push(colorRow('Box background', 'The box drawn behind this part only', bg, v => save(lay, 'bgcolor_override', v, id), ['bgcolor_override']));
  }

  const value = type === '0' || (type === '2' && squareTex(p)) ? 'square' : type === '2' ? 'round' : 'other';

  if (hud.roundOnly) rows.push(noteRow('The game always draws this box rounded.'));

  TextEntry: [['Text fields', 'ButtonDepressedBorder']], ListPanel: [['Lists', 'ButtonDepressedBorder']], SectionedListPanel: [['Lists', 'ButtonDepressedBorder']],
  ProgressBar: [['Progress bars', 'ButtonDepressedBorder']], Menu: [['Menus', 'MenuBorder']], MenuItem: [['Menus', 'MenuBorder']],

  ScrollBarSlider: [['Scroll bar handle', 'ButtonBorder']], Slider: [['Slider knob', 'ButtonBorder'], ['Slider track', 'ButtonDepressedBorder']],

function borderOf(file, name) {

  const aliasOf = (p, n) => p.entries.find(e => e.path.length === 2 && low(e.path[1]) === 'borders' && low(e.key) === low(n));
  for (let n = name, hops = 0; hops < 8; hops++) {
    let next = null;
    for (const p of [f.parsed, ...f.bases]) {
      if (isBlock(p, n)) return { name: n, ...readBorder(f, n) };
      const a = aliasOf(p, n);

    if (!next && low(n) === 'baseborder') return null;

    for (const e of p.entries) {
      if (e.path.length < 3 || low(e.path[1]) !== 'borders' || low(e.path[2]) !== low(n)) continue;
      if (e.path.length === 3) { props[low(e.key)] = e.value; continue; }
      const side = SIDES.find(s => low(s) === low(e.path[3]));
      if (e.path.length !== 5 || !side) continue;
      (sides[side][e.path[4]] ||= {})[low(e.key)] = e.value;
      if (i < all.length - 1) base[side] = Math.max(base[side], Object.keys(sides[side]).length);

function borderState(b, t) {

// The block for that state. Every side is written, with a clear line where nothing should draw: a running game keeps

function borderBody(st, b) {
  const n = Math.max(1, Math.min(8, +st.n || 1));
  const body = [['inset', SIDES.map(s => st.on[s] ? n : 0).join(' ')]]; // left top right bottom
  if (b && b.props.backgroundtype) body.push(['backgroundtype', b.props.backgroundtype]);
  for (const s of SIDES) {
    const count = Math.max(n, (b && b.base[s]) || 0, (b && b.sides && b.sides[s].length) || 0);
    body.push([s, Array.from({ length: count }, (_, i) => [String(i + 1), [['color', st.on[s] && i < n ? st.colour : '0 0 0 0'], ['offset', '0 0']]])]);

function copyBorder(b, change) {
  const props = { ...(b ? b.props : {}), ...change };
  const body = Object.entries(props).map(([k, v]) => [k, v]);
  for (const s of SIDES) if (b && b.sides[s].length) body.push([s, b.sides[s].map((l, i) => [String(i + 1), Object.entries(l)])]);
  return body;
}

function borderRows(file, name) {
  const f = F(file), t = tables(f), b = borderOf(file, name), cur = borderState(b, t);
  // the block as it is when written: another row (window corners) may have changed it since this list was drawn
  const write = () => save(f, name, () => {
    const now = borderOf(file, name), own = now && now.name.toLowerCase() === name.toLowerCase();
    return borderBody(cur, own ? now : { props: now ? now.props : {}, base: readBorder(f, name).base, sides: now ? now.sides : null });
  }, ['Borders']);
  const sides = el('div', { className: 'row sides' });
  sides.append(el('div', { textContent: 'Sides' }), ...['Top', 'Left', 'Right', 'Bottom'].map(s => {
    const l = el('label'), box = el('input', { type: 'checkbox', checked: cur.on[s], onchange: () => { cur.on[s] = box.checked; write(); } });
    l.append(box, s);
    return l;
  }));
  sides.dataset.q = 'border sides top left right bottom';
  const rows = [sides,
    inputRow('Thickness', String(cur.n), v => { cur.n = v; write(); }, { type: 'number', min: 1, max: 8, step: 1, title: 'pixels' }),
    colorRow('Colour', 'The ticked sides', cur.colour, v => { cur.colour = v; write(); }, [name])];
  const notes = [cur.mixed && 'The HUD gives this border more than one colour; a change here makes every side this colour.',
    b && b.name.toLowerCase() !== name.toLowerCase() && `Now the same as ${b.name}; a change here gives this one its own.`,
    BORDER_SHARED[name] && `Also changes ${BORDER_SHARED[name]}.`].filter(Boolean);

}

// Square or rounded windows: FrameBorder's backgroundtype. Where FrameBorder isn't its own block, it becomes one
// copied from what windows use now, so they keep their edge lines.
function windowCornerRow(file) {
  const f = F(file), b = borderOf(file, 'FrameBorder');
  return selectRow('Window corners', [['2', 'Rounded'], ['0', 'Square']], b && b.props.backgroundtype === '2' ? '2' : '0',
    v => save(f, 'FrameBorder', () => copyBorder(borderOf(file, 'FrameBorder'), { backgroundtype: v }), ['Borders']), ['FrameBorder']);
}

// The control type, in context: the buy menu's buttons are the same class as team select's but draw text with Label.TextColor.
function controlIn(p, thing) {
  if (p.cls === 'MouseOverButton' && thing && thing.key.startsWith('buy')) return CONTROLS.find(([k]) => k === 'BuyMouseOverPanelButton');
  // a scroll bar's arrows report themselves as plain Buttons but draw with the scroll bar's colours
  if (p.cls === 'Button' && p.parent && p.parent.cls.endsWith('ScrollBar')) return controlOf(p.parent.cls);
  return controlOf(p.cls);
}

// The clicked control's own block in the window's .res file (walking up to its parents if it has none).
// Rows made from a template get their own names (scoreboard: block "CTPlayerName0" -> panel "_CT_playername0",
// "CTPlayerLatency0" -> "_CT_playerping0"), so names are compared without case or underscores.
function ownBlock(sel) {
  const norm = s => s.toLowerCase().replace(/_/g, '').replace('ping', 'latency');
  const blocks = sel.res.parsed.sections.filter(s => s.path.length === 2).map(s => s.path[1]);
  for (let p = sel.node; p && p !== sel.thing; p = p.parent) {
    const block = p.name && blocks.find(b => norm(b) === norm(p.name));
    if (!block) continue;
    const ctl = controlIn(p, sel.thing);
    return { block, ctl: ctl && ctl[0], what: ctl ? ctl[1].toLowerCase() : p.cls.endsWith('ImagePanel') ? 'image' : 'part', defaults: ctl ? ctl[2] : [] };
  }
  return null;
}

const POS = [['xpos', 'X position'], ['ypos', 'Y position'], ['wide', 'Width'], ['tall', 'Height']];

// A single control's settings in a window .res: its own text/background/fill colour (falling back to the
// scheme colour it would otherwise use) and position/size.
const OWN_NOTE = { fgcolor_override: 'Text colour of just this one; overrides the shared colour below',
  bgcolor_override: 'Background of just this one; overrides the shared colour below', fillcolor: 'Colour this shape or image is filled with' };
function resRows(f, block, defaults, schemeFile, ctl) {
  const p = layoutProps(f, block), sf = F(schemeFile), t = sf ? tables(sf) : EMPTY_TABLES, rows = [];
  const def = label => { const d = defaults.find(([l]) => l === label); return d && resolve(t, d[1]); };
  const own = (key, label, fallback) => {
    const v = (p[key] && resolve(t, p[key])) || fallback;
    if (v) rows.push(colorRow(label, OWN_NOTE[key], v, v2 => save(f, key, v2, block), [key]));
  };
  rows.push(showRow(f, block, 'Show on screen'));
  if (PLAYER_ROW.test(block)) rows.push(noteRow('Player rows are placed like this, but coloured from Scoreboard: player rows below.'));
  else {
    own('fgcolor_override', 'Text', def('Text'));
    own('bgcolor_override', 'Background', def('Background'));
    if ('fillcolor' in p) own('fillcolor', 'Fill', null);
    // which font this one control draws with: any font in its scheme (the game reads "font" from the .res)
    const deflt = CONTROL_FONTS[ctl] && CONTROL_FONTS[ctl][0][1];
    if (p.font || deflt) rows.push(inputRow('Font', p.font || deflt, v => save(f, 'font', v, block),
      { list: fontList(schemeFile), title: `Just this one; any font in ${schemeFile}` }));
  }
  for (const [k, label] of POS) if (k in p || k.endsWith('pos')) rows.push(numRow(f, block, k, label, p[k]));
  return rows;
}

// Fonts a HUD part draws with by default (HudLayout font keys, when set, win). From telehud's comments and the SDK.
const HUD_FONTS = { HudHealth: ['HudNumbers'], HudArmor: ['HudNumbers'], HudAmmo: ['HudNumbers'], HudAccount: ['HudNumbers'], HudRoundTimer: ['HudNumbers'],
  HudHintDisplay: ['HudHintText'], HudHintKeyDisplay: ['HudHintTextSmall'], CCenterStringLabel: ['Trebuchet24'], HudMessage: ['CenterPrintText'], TargetID: ['TargetID'],
  HudWeaponSelection: ['HudSelectionNumbers', 'HudSelectionText'], HudMenu: ['Default'], HudDeathNotice: ['Default'], HudRadar: ['ChatFont'], HudChat: ['ChatFont'] };

// Fonts a selection draws with, as [scheme file, font, what for]: the control's own .res "font", HudLayout font keys
// and the defaults above for HUD parts, the fonts the game gives some windows, and control types' defaults. With a
// whole window selected, every font its controls use.
function fontsOf(sel) {
  const out = [];
  const add = (file, font, what) => {
    const have = font && out.find(([f, n]) => f === file && n.toLowerCase() === font.toLowerCase());
    if (have) { if (what && !have[2].split(', ').includes(what)) have[2] += `, ${what}`; }
    else if (font && hasFont(file, font)) out.push([file, font, what || '']);
  };
  const file = schemeOf(sel.control || sel.thing);
  if (sel.info.kind === 'hud') {
    const hf = sel.info.hud.scheme || schemeOf(sel.thing), p = layoutProps(F(L), sel.info.id);
    for (const [k, v] of Object.entries(p)) if (/font/.test(k) && !/^font_?size/.test(k)) add(hf, v, k);
    if (!out.length) for (const n of HUD_FONTS[sel.info.id] || []) add(hf, n, '');
    return out;
  }
  if (WINDOW_FONTS[sel.info.id]) { // set by the game's code, whatever the controls' defaults say
    for (const [f, what, names] of WINDOW_FONTS[sel.info.id]) add(f, names.split('|').find(n => hasFont(f, n)), what);
    return out;
  }
  const own = sel.res && sel.node && ownBlock(sel), ownFont = own && layoutProps(sel.res, own.block).font;
  if (ownFont) add(file, ownFont, 'this one');
  if (sel.control) {
    const ctl = controlIn(sel.control, sel.thing);
    for (const [what, font] of (ctl && CONTROL_FONTS[ctl[0]] || []).slice(ownFont ? 1 : 0)) add(file, font, what.toLowerCase());
    return out;
  }
  if (sel.info.file === S && sel.info.id !== 'gamemenu') add(S, resolveString(S, 'FrameTitleBar.Font') || 'Default', 'title');
  if (sel.res) for (const s of sel.res.parsed.sections.filter(s => s.path.length === 2)) {
    const f = layoutProps(sel.res, s.path[1]).font;
    if (f) add(schemeOf(sel.thing), f, s.path[1]);
  }
  for (const p of live ? live.panels.filter(p => p.thing === sel.thing && p !== sel.thing) : []) {
    const ctl = controlIn(p, sel.thing);
    for (const [what, font] of ctl && CONTROL_FONTS[ctl[0]] || [])
      add(schemeOf(p), font, what.toLowerCase() === ctl[1].toLowerCase() ? what.toLowerCase() : `${ctl[1].toLowerCase()} ${what.toLowerCase()}`);
  }
  return out;
}

const hasFont = (file, font) => !!(F(file) && font && fontVariants(F(file), font).size);
// A BaseSettings string (FrameTitleBar.Font...), own file over #base.
function resolveString(file, key) {
  const f = F(file);
  let v = null;
  for (const p of f ? [...f.bases, f.parsed] : []) for (const e of p.entries)
    if (e.path.length === 2 && e.path[1].toLowerCase() === 'basesettings' && e.key.toLowerCase() === key.toLowerCase()) v = e.value;
  return v;
}

    if (e.path.length >= 3 && e.path[1].toLowerCase() === 'fonts' && !seen.has(e.path[2].toLowerCase())) seen.set(e.path[2].toLowerCase(), e.path[2]);

// Every font of every scheme, for ones nothing on screen uses right now. Filled when opened; stays open.
const FONT_FILES = [[C, 'in game'], [S, 'menus'], [CH, 'chat']];
let openAllFonts = false;
function allFonts() {
  const d = el('details');
  d.append(el('summary', { textContent: 'All fonts' }));
  const fill = () => {
    if (d.childElementCount > 1) return;
    let face = '', weight = '';
    const go = el('button', { textContent: 'Apply to every text font', onclick: () => setAllFonts(face.trim(), weight.trim()) });
    const apply = el('div', { className: 'row check' });
    apply.append(el('span'), go);
    apply.dataset.q = 'every font all fonts';
    d.append(el('div', { className: 'sub', textContent: 'Every text font at once' }),
      inputRow('Font', '', v => { face = v; }, { list: 'fontfaces', title: 'Left empty: faces stay as they are' }),
      inputRow('Weight', '', v => { weight = v; }, { type: 'number', step: 100, min: 100, max: 900, title: 'Left empty: weights stay' }),
      noteRow('Icon and symbol fonts (weapon icons, the logo, arrows) are left alone. Every screen size is changed.'), apply);

// Faces that draw icons and symbols, not text: "every text font" leaves them alone.
const SYMBOL_FACES = new Set(['marlett', 'counter-strike', 'counter-strike logo', 'cs', 'csd', 'halflife2', 'buttons', 'webdings', 'wingdings']);
// One face and/or weight for every text font in every scheme, each file written once.
async function setAllFonts(face, weight) {
  if (!face && !weight) return status('Type a font, a weight, or both first.');
  let n = 0;
  for (const [file] of FONT_FILES) {
    const f = F(file);
    if (!f) continue;
    commit(f, `${file}/every font`, () => {
      let cur = f;
      for (const font of fontNames(file)) for (const [v, p] of fontVariants(cur, font)) {
        if (SYMBOL_FACES.has((p.name || '').toLowerCase())) continue;
        for (const [k, val] of [['name', face], ['weight', weight]]) {
          if (!val || p[k] === val) continue;
          const text = setAt(cur, ['Fonts', font, v], k, val);
          cur = { ...cur, text, parsed: parse(text) };
        }
        n++;

      return cur.text;

  render();
  status(`${[face, weight && `weight ${weight}`].filter(Boolean).join(', ')} on ${n} font entries. Icon fonts were left alone.`);
}

// A font's settings in a fold, filled when first opened. Open ones stay open across re-renders.
const openFonts = new Set();
function fontFold(file, font, what, open) {

  d.append(el('summary', { textContent: what ? `${font}: ${what}` : font }));
  const fill = () => { if (d.childElementCount === 1) d.append(...fontRows(file, font)); };
  d.ontoggle = () => { if (d.open) { openFonts.add(key); fill(); } else openFonts.delete(key); };
  if (open || openFonts.has(key)) { d.open = true; fill(); }
  d.dataset.q = `${font} ${what} font`.toLowerCase();

}


function inputRow(label, value, onChange, attrs = {}) {
  const row = el('div', { className: 'row num' });

  input.oninput = () => { if (input.value !== '') onChange(input.value); };
  let box = input;
  if (attrs.type === 'number') { // - and + beside the box instead of the browser's arrows inside it
    const step = (up, text) => el('button', { textContent: text, tabIndex: -1, title: up ? 'Up' : 'Down',
      onclick: () => { try { up ? input.stepUp() : input.stepDown(); } catch { return; } input.oninput(); } });
    box = el('div', { className: 'step' });
    box.append(step(false, '−'), input, step(true, '+'));

  row.append(el('div', { textContent: label }), box, el('div', { className: 'meta', textContent: attrs.title || '' }));
  row.dataset.q = label.toLowerCase();

}

// A font's settings for the current screen height. Edits go to that entry only (fonts have one per resolution).

  const H = live ? live.H : 1080, v = activeVariant(vars, H), p = vars.get(v);
  const put = (key, val) => save(f, key, val, ['Fonts', font, v]);
  const checks = [['outline', 'Outline'], ['dropshadow', 'Drop shadow'], ['additive', 'Additive (glow): hides outline and shadow'], ['antialias', 'Smooth edges']]
    .map(([key, label]) => checkRow(label, p[key] === '1', on => {
      put(key, on ? '1' : '0');

      const glow = checks[2].firstElementChild;

// Copies a font file into the HUD, lists it in CustomFontFiles (the game registers it, live) and switches this font to it.
async function addFontFile(f, font, v) {
  try {

    const used = [...f.bases, f.parsed].flatMap(p => p.entries).filter(e => e.path.length === 2 && e.path[1].toLowerCase() === 'customfontfiles').map(e => +e.key);
    save(f, String(Math.max(0, ...used.filter(n => n > 0)) + 1), rel, ['CustomFontFiles']);
    save(f, 'name', family, ['Fonts', font, v]);

    await sleep(400);

    render();

// The main menu background: the game stretches materials/console/background01 (4:3 screens) or
// background01_widescreen over the screen, read once at startup. The picture is cropped to that shape and written
// as VTF 7.2, BGR888 (no compression, so dark gradients don't band), one mip level, power-of-two sizes.

  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, sw = Math.min(iw, ih * aspect), sh = sw / aspect;
  g.imageSmoothingQuality = 'high';

  g.drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, 0, 0, w, h);
  const px = g.getImageData(0, 0, w, h).data, out = new Uint8Array(80 + w * h * 3), v = new DataView(out.buffer);
  out.set([86, 84, 70]); // "VTF"

  v.setUint32(20, 0x4 | 0x8 | 0x100 | 0x200, true); // clamp S and T, no mipmaps, no LOD
  v.setUint16(24, 1, true), v.setFloat32(48, 1, true), v.setUint32(52, 3, true); // one frame, bumpmap scale, BGR888

const base64 = bytes => new Promise(res => {
  const r = new FileReader();
  r.onload = () => res(r.result.slice(r.result.indexOf(',') + 1));
  r.readAsDataURL(new Blob([bytes]));
});
async function setBackground(file) {
  const img = new Image(), url = URL.createObjectURL(file);
  try {
    img.src = url;
    await img.decode();
    status('Making the background...');
    for (const [name, w, h, aspect] of [['background01', 1024, 1024, 4 / 3], ['background01_widescreen', 2048, 1024, 16 / 9]]) {
      const path = `materials/console/${name}`;
      await call('writebin', `${path}.vtf`, await base64(backgroundVtf(img, w, h, aspect)));
      await call('write', `${path}.vmt`, `"UnlitGeneric"\n{\n\t"$basetexture"\t"console/${name}"\n\t"$vertexcolor"\t"1"\n\t"$vertexalpha"\t"1"\n`
        + `\t"$ignorez"\t"1"\n\t"$no_fullbright"\t"1"\n\t"$nolod"\t"1"\n}\n`);
    }
    setDirty(true);
    status('Background set. Save the HUD, then restart the game to see it.');
  } catch (err) {

// Everything editable for a selection, as [subheading, rows] pairs.
// Everything editable for a selection, as [title, rows] pairs: colours first, then fonts, then borders, then the
// rest (what's shown, the menu's buttons...). Titles say the kind first, then what it's for.
function selectionSections(sel) {
  const groups = { colour: [], font: [], border: [], other: [] }, add = (kind, title, rows) => groups[kind].push([title, rows]);
  const { info, control } = sel, fonts = fontsOf(sel), own = sel.res && ownBlock(sel);
  // what was clicked, on its own: shown or not, position, and its own colours over the shared ones below
  // (these menus read their .res only when the game makes them; the scoreboard and spectator bars read it on a reload)
  if (own) add('colour', `Just this ${own.what}`, [...(STARTUP_RES.has(info.id) ? [noteRow('This window reads its layout when the game starts: showing, hiding and moving things here appear after a game restart. Colours and fonts change straight away.')] : []),
    ...resRows(sel.res, own.block, own.defaults, schemeOf(sel.thing), own.ctl)]);
  if (control) {
    const [ctl, what, keys] = controlIn(control, sel.thing);
    const file = schemeOf(control), where = file === C ? 'in-game windows' : file === CH ? 'the chat' : 'menus';
    add('colour', `Colours: every ${what.toLowerCase()} in ${where}`, [
      // the chat keeps its scroll bar once it holds more lines than fit, even closed; the default colours are see-through
      ...(file === CH && ctl.startsWith('ScrollBar') ? [noteRow('The chat shows this scroll bar even while it is closed. Keep it see-through (low opacity) or it stays on screen.')] : []),
      ...schemeRows(file, keys), ...(ctl.startsWith('ScrollBar') ? [scrollWideRow(file)].filter(Boolean) : [])]);
    for (const [label, name] of BORDER_USE[ctl] || []) add('border', `Border: ${label.toLowerCase()} in ${where}`, borderRows(file, name));
  }
  if (info.kind === 'hud') {
    add('colour', info.name, hudRows(info.id, info.hud));
    if (info.id === 'HudChat' && sel.res) add('other', 'Chat: space inside', chatPaddingRows(sel));
    add('other', `${info.name}: hidden parts`, windowPartRows(sel)); // parts moved off screen (the chat's Filters button) can't be clicked any more
  } else {
    if (info.id !== 'gamemenu') { // the main menu isn't a window frame
      // menu windows paint their frame's background and edge; in-game ones (team select...) draw their own panels
      const frame = info.file === S;
      add('colour', 'Colours: the window', schemeRows(info.file, WINDOW_COLOURS[info.file]));
      if (frame) add('border', 'Border: window edge (every window)', [windowCornerRow(S), ...borderRows(S, 'FrameBorder')]);
    }
    if (EXTRA[info.id]) add('colour', `Colours: ${info.name.toLowerCase()}`, schemeRows(S, EXTRA[info.id]).concat(info.file === C ? schemeRows(C, EXTRA[info.id]) : []));
    add('other', `${info.name}: show or hide parts`, windowPartRows(sel));
    if (info.id === 'scores') for (const [t, r] of scoreboardSections(sel, fonts.map(([, n]) => n))) add(/fonts$/.test(t) ? 'font' : 'colour', t, r);
    if (info.id === 'gamemenu') for (const [t, r] of mainMenuSections()) add(/logo$/.test(t) ? 'colour' : 'other', t, r);
    if (/serverbrowser/.test(info.id)) add('other', 'Server browser: buttons', serverBrowserRows());
  }
  if (fonts.length) add('font', `${fonts.length > 1 ? 'Fonts' : 'Font'} (a change shows everywhere the font is used)`,
    fonts.map(([file, font, what]) => fontFold(file, font, what, fonts.length <= 2 && (control || info.kind === 'hud'))));
  // a font the game asks for by name that its own scheme never defines (the right-side text's HudHintTextSmall): it

  if (info.kind === 'hud') {
    const hf = info.hud.scheme || C, missing = (HUD_FONTS[info.id] || []).filter(n => F(hf) && !hasFont(hf, n));
    add('font', 'Font the game is missing', missing.map(n => {
      const b = el('button', { textContent: `Add ${n} to the HUD` });
      b.onclick = () => { save(F(hf), n, [['1', [['name', 'Verdana'], ['tall', '9'], ['weight', '700'], ['antialias', '1']]]], ['Fonts']); refreshSoon(); };
      const r = noteRow(`The game draws this with the font ${n}, which it doesn't come with, so it uses a stand-in. Add it to set its look. `);
      r.append(b);

  const seen = new Map();
  if (live) {
